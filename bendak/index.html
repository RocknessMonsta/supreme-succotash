<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bendak Starkiller — Death Match</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;
  font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;}
#c{display:block;width:100vw;height:100vh;}

/* ── HUD ── */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;}

/* crosshair */
#xhair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:24px;height:24px;opacity:.7;}
#xhair::before,#xhair::after{content:'';position:absolute;background:#ff9040;border-radius:2px;}
#xhair::before{width:2px;height:100%;left:50%;transform:translateX(-50%);}
#xhair::after{width:100%;height:2px;top:50%;transform:translateY(-50%);}

/* health bars */
.hpblock{position:absolute;top:3%;width:28%;padding:.5em .8em;
  background:rgba(5,10,18,.85);border-radius:8px;
  border:1px solid rgba(94,224,255,.3);backdrop-filter:blur(4px);}
#hpblock-l{left:2%;}#hpblock-r{right:2%;}
.hpname{font-weight:700;font-size:clamp(11px,1.5vw,17px);letter-spacing:.05em;color:#cfe6f5;}
.hptag{font-size:clamp(8px,.9vw,11px);color:#6a96b0;font-style:italic;margin-top:1px;}
.hpbar{height:9px;margin-top:6px;background:#0d1e2e;border-radius:5px;overflow:hidden;}
.hpfill{height:100%;border-radius:5px;transition:width .2s;}
.hpfill.green{background:linear-gradient(90deg,#3dcc6a,#8aff7d);}
.hpfill.red{background:linear-gradient(90deg,#cc3d3d,#ff7d5e);}
.hpfill.shield{background:linear-gradient(90deg,#5ee0ff,#3da8cc);}
.hpnum{font-size:clamp(8px,.85vw,11px);color:#7aafcc;margin-top:3px;}

/* ability bar */
#bar{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);
  display:flex;gap:.5em;pointer-events:all;}
.ab{position:relative;width:clamp(50px,7vw,82px);aspect-ratio:1;
  background:rgba(5,10,18,.88);border:1px solid rgba(94,224,255,.35);
  border-radius:10px;color:#cfe6f5;cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:border-color .12s,transform .07s;}
.ab:active{transform:scale(.93);}
.ab:hover{border-color:rgba(232,197,88,.8);}
.ab .ico{font-size:clamp(16px,2.4vw,28px);}
.ab .lbl{font-size:clamp(6px,.7vw,9px);margin-top:2px;letter-spacing:.04em;}
.ab .hotkey{position:absolute;top:3px;left:6px;font-size:clamp(7px,.75vw,10px);
  color:#e8c558;font-weight:700;}
.ab .cnt{position:absolute;top:3px;right:6px;font-size:clamp(7px,.75vw,10px);
  color:#5ee0ff;font-weight:700;}
.ab .cdmask{position:absolute;bottom:0;left:0;width:100%;
  background:rgba(3,7,14,.8);pointer-events:none;transition:height .05s;}
.ab.off{opacity:.35;cursor:default;}

/* combat log */
#log{position:absolute;bottom:3%;left:2%;width:28%;max-height:22%;
  overflow:hidden;display:flex;flex-direction:column-reverse;
  font-size:clamp(8px,1vw,13px);pointer-events:none;}
#log div{padding:2px 0;text-shadow:0 1px 3px #000;animation:lf 6s forwards;}
@keyframes lf{0%{opacity:1}65%{opacity:.9}100%{opacity:0}}
.lhit{color:#ffd27d}.lmiss{color:#7d9bb0}.lcrit{color:#ff7d7d;font-weight:700}
.lsys{color:#5ee0ff}.lann{color:#e8c558;font-style:italic}

/* vignette */
#vign{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%);}

/* damage flash overlay */
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at 50% 50%,rgba(255,60,40,.55),transparent 70%);}

/* pause */
#pausebanner{position:absolute;inset:0;display:none;align-items:center;
  justify-content:center;background:rgba(3,7,14,.5);pointer-events:none;}
#pausebanner span{font-size:clamp(20px,3.5vw,48px);font-weight:800;
  letter-spacing:.35em;color:#5ee0ff;border-top:1px solid rgba(94,224,255,.4);
  border-bottom:1px solid rgba(94,224,255,.4);padding:.3em 1.2em;
  text-shadow:0 0 30px rgba(94,224,255,.5);}

/* screens */
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;
  justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:radial-gradient(ellipse at 50% 30%,#0d1c30 0%,#04080f 80%);}
#overlay.gone{display:none;}
.screen{width:min(94%,780px);text-align:center;padding:2em 1.5em 3em;}
h1{font-size:clamp(28px,5.5vw,64px);letter-spacing:.1em;color:#e8c558;
  font-weight:800;text-shadow:0 0 40px rgba(232,197,88,.35);}
h2{font-size:clamp(12px,1.5vw,18px);color:#5ee0ff;letter-spacing:.3em;margin-bottom:.4em;}
.sub{color:#8ab4cc;font-size:clamp(11px,1.2vw,15px);max-width:540px;
  margin:.8em auto 1.6em;line-height:1.6;}
.btn{display:inline-block;margin:.35em;padding:.65em 2em;
  background:linear-gradient(180deg,#14263a,#0b1726);color:#e8c558;
  border:1px solid rgba(94,224,255,.35);border-radius:8px;
  font-size:clamp(12px,1.3vw,17px);letter-spacing:.1em;cursor:pointer;
  font-weight:700;transition:border-color .14s,transform .07s;pointer-events:all;}
.btn:hover{border-color:#e8c558;}.btn:active{transform:scale(.95);}
.btn.danger{color:#ff5e5e;border-color:rgba(255,94,94,.3);}
.btn.danger:hover{border-color:#ff5e5e;}
kbd{background:#14263a;border:1px solid rgba(94,224,255,.3);border-radius:4px;
  padding:1px 6px;color:#5ee0ff;font-family:inherit;}
.hint{color:#4a7090;font-size:clamp(9px,.95vw,12px);margin-top:1.4em;}
.stat-row{display:flex;gap:1em;justify-content:center;flex-wrap:wrap;
  margin:.6em 0;font-size:clamp(10px,1.1vw,14px);}
.stat{background:rgba(8,16,28,.8);border:1px solid rgba(94,224,255,.25);
  border-radius:8px;padding:.4em .9em;color:#9fc6dd;}
.stat b{color:#e8c558;}

/* rotate hint */
#rotHint{display:none;position:fixed;inset:0;z-index:99;background:#04080f;
  color:#5ee0ff;font-size:22px;font-weight:700;align-items:center;
  justify-content:center;text-align:center;flex-direction:column;gap:1em;padding:2em;}
@media(max-width:640px)and(orientation:portrait){#rotHint{display:flex;}}
</style>
</head>
<body>
<div id="rotHint"><span style="font-size:40px">↻</span>Rotate to landscape<br>
  <span style="font-size:14px;color:#8fb4cc">The arena needs landscape mode</span></div>
<canvas id="c"></canvas>
<div id="hud">
  <div id="vign"></div>
  <div id="flash"></div>
  <div id="xhair"></div>

  <div class="hpblock" id="hpblock-l">
    <div class="hpname">The Mysterious Stranger</div>
    <div class="hptag">Sponsored by Nobody</div>
    <div class="hpbar"><div class="hpfill green" id="phpfill"></div></div>
    <div class="hpnum" id="phpnum"></div>
  </div>
  <div class="hpblock" id="hpblock-r">
    <div class="hpname">Bendak Starkiller</div>
    <div class="hptag" style="color:#cc5050">☠ Death Match — No Yields</div>
    <div class="hpbar"><div class="hpfill red" id="bhpfill"></div></div>
    <div class="hpnum" id="bhpnum"></div>
    <div class="hpbar" style="margin-top:3px"><div class="hpfill shield" id="bshfill" style="width:0%"></div></div>
  </div>

  <div id="bar">
    <button class="ab" id="ab0" onclick="tryAbility(0)">
      <span class="hotkey">1</span><span class="ico">🔫</span><span class="lbl">Blaster</span>
      <div class="cdmask" id="cd0" style="height:0%"></div></button>
    <button class="ab" id="ab1" onclick="tryAbility(1)">
      <span class="hotkey">2</span><span class="ico">💥</span><span class="lbl">Power</span>
      <div class="cdmask" id="cd1" style="height:0%"></div></button>
    <button class="ab" id="ab2" onclick="tryAbility(2)">
      <span class="hotkey">3</span><span class="ico">🔁</span><span class="lbl">Rapid</span>
      <div class="cdmask" id="cd2" style="height:0%"></div></button>
    <button class="ab" id="ab3" onclick="tryAbility(3)">
      <span class="hotkey">4</span><span class="cnt" id="sh-cnt">×1</span>
      <span class="ico">🛡️</span><span class="lbl">Shield</span>
      <div class="cdmask" id="cd3" style="height:0%"></div></button>
    <button class="ab" id="ab4" onclick="tryAbility(4)">
      <span class="hotkey">5</span><span class="cnt" id="med-cnt">×2</span>
      <span class="ico">💉</span><span class="lbl">Medpac</span>
      <div class="cdmask" id="cd4" style="height:0%"></div></button>
    <button class="ab" id="ab5" onclick="tryAbility(5)">
      <span class="hotkey">Q</span><span class="ico">🌀</span><span class="lbl">Dodge</span>
      <div class="cdmask" id="cd5" style="height:0%"></div></button>
  </div>
  <div id="log"></div>
  <div id="pausebanner"><span>TACTICAL PAUSE</span></div>
</div>

<div id="overlay"><div class="screen" id="screen"></div></div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ═══════════════════════════════════════════════════════
   KOTOR: TARIS DUELING ARENA — BENDAK STARKILLER
   Death Match. First-person. d20 under the hood.
   ═══════════════════════════════════════════════════════ */

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const irnd=(a,b)=>Math.floor(rnd(a,b+1));
const d=(s)=>irnd(1,s);
const d20=()=>d(20);
const TAU=Math.PI*2;

// ── Three.js setup ──────────────────────────────────────
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x060c18,0.018);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,300);
camera.position.set(0,1.75,7);
camera.lookAt(0,1.4,0);

// post-processing
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.55,0.38,0.82);
composer.addPass(bloom);

function resize(){
  const w=innerWidth,h=innerHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h); composer.setSize(w,h);
}
addEventListener('resize',resize); resize();

// ── Textures (canvas-generated) ─────────────────────────
function makeFloorTex(){
  const sz=512,cv=document.createElement('canvas'); cv.width=cv.height=sz;
  const c=cv.getContext('2d');
  c.fillStyle='#111e2e'; c.fillRect(0,0,sz,sz);
  // tile grid
  c.strokeStyle='rgba(60,140,200,.25)'; c.lineWidth=1;
  for(let i=0;i<=sz;i+=sz/8){c.beginPath();c.moveTo(i,0);c.lineTo(i,sz);c.stroke();
    c.beginPath();c.moveTo(0,i);c.lineTo(sz,i);c.stroke();}
  // center glyph
  c.strokeStyle='rgba(94,224,255,.5)'; c.lineWidth=2;
  c.beginPath(); c.arc(sz/2,sz/2,sz*0.08,0,TAU); c.stroke();
  c.beginPath(); c.arc(sz/2,sz/2,sz*0.18,0,TAU); c.stroke();
  for(let a=0;a<8;a++){const ang=a*Math.PI/4;
    c.beginPath(); c.moveTo(sz/2+Math.cos(ang)*sz*0.08,sz/2+Math.sin(ang)*sz*0.08);
    c.lineTo(sz/2+Math.cos(ang)*sz*0.18,sz/2+Math.sin(ang)*sz*0.18); c.stroke();}
  const t=new THREE.CanvasTexture(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(4,4); return t;
}
function makeWallTex(){
  const sz=256,cv=document.createElement('canvas'); cv.width=cv.height=sz;
  const c=cv.getContext('2d');
  c.fillStyle='#0d1928'; c.fillRect(0,0,sz,sz);
  c.strokeStyle='rgba(50,90,130,.4)'; c.lineWidth=1;
  for(let i=0;i<sz;i+=32){c.beginPath();c.moveTo(0,i);c.lineTo(sz,i);c.stroke();}
  for(let i=0;i<sz;i+=64){c.beginPath();c.moveTo(i,0);c.lineTo(i,sz);c.stroke();}
  const t=new THREE.CanvasTexture(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(3,2); return t;
}

const floorTex=makeFloorTex();
const wallTex=makeWallTex();

// ── Materials ───────────────────────────────────────────
const MAT={
  floor: new THREE.MeshStandardMaterial({map:floorTex,roughness:.55,metalness:.4,color:0x1a2f48}),
  platform: new THREE.MeshStandardMaterial({roughness:.4,metalness:.6,color:0x1e3550}),
  edgeGlow: new THREE.MeshStandardMaterial({color:0x00aaff,emissive:new THREE.Color(0x0077cc),emissiveIntensity:2.5,roughness:.2,metalness:.8}),
  edgeGlowRed: new THREE.MeshStandardMaterial({color:0xff3300,emissive:new THREE.Color(0xff2200),emissiveIntensity:2.5,roughness:.2,metalness:.8}),
  column: new THREE.MeshStandardMaterial({map:wallTex,roughness:.7,metalness:.3,color:0x182840}),
  gold: new THREE.MeshStandardMaterial({color:0xd4a830,roughness:.25,metalness:.88}),
  darkArmor: new THREE.MeshStandardMaterial({color:0x1a2838,roughness:.4,metalness:.7}),
  visor: new THREE.MeshStandardMaterial({color:0xff4400,emissive:new THREE.Color(0xff3300),emissiveIntensity:4,roughness:.1,metalness:.9}),
  visorGlow: new THREE.MeshStandardMaterial({color:0xff6600,emissive:new THREE.Color(0xff5500),emissiveIntensity:6,roughness:.05,metalness:1,transparent:true,opacity:.7}),
  skin: new THREE.MeshStandardMaterial({color:0xc09060,roughness:.8,metalness:0}),
  bolt: new THREE.MeshStandardMaterial({color:0xff8844,emissive:new THREE.Color(0xff6600),emissiveIntensity:8,roughness:0,metalness:1}),
  boltCore: new THREE.MeshStandardMaterial({color:0xffffff,emissive:new THREE.Color(0xfff0d0),emissiveIntensity:12,roughness:0,metalness:1}),
  smoke: new THREE.MeshStandardMaterial({color:0x88aacc,transparent:true,opacity:.12,roughness:1,depthWrite:false}),
  city: new THREE.MeshStandardMaterial({color:0x0a1828,roughness:.9,metalness:.1}),
  cityLit: new THREE.MeshStandardMaterial({color:0xffdd88,emissive:new THREE.Color(0xffcc44),emissiveIntensity:.8,roughness:1}),
  crowd: new THREE.MeshStandardMaterial({color:0x1a3050,roughness:.9,metalness:.0}),
  ground: new THREE.MeshStandardMaterial({color:0x060c14,roughness:1,metalness:0}),
};

// ── Geometry helpers ─────────────────────────────────────
function box(w,h,d,mat,rx=0,ry=0,rz=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.rotation.set(rx,ry,rz); m.castShadow=true; m.receiveShadow=true; return m;
}
function cyl(rt,rb,h,seg,mat){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);
  m.castShadow=true; m.receiveShadow=true; return m;
}
function sphere(r,seg,mat){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,seg,seg),mat); m.castShadow=true; return m;
}
function addTo(parent,...children){children.forEach(c=>parent.add(c)); return parent;}

// ── Arena ────────────────────────────────────────────────
function buildArena(){
  const root=new THREE.Group(); scene.add(root);

  // Outer ground
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),MAT.ground);
  ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; root.add(ground);

  // Main platform disc
  const platform=cyl(10,.1,10.3,64,MAT.floor);
  platform.rotation.x=0; platform.position.y=.15; platform.receiveShadow=true;
  root.add(platform);

  // Edge trim ring
  const isDeath=true; // always death match
  const edgeMat=MAT.edgeGlowRed;
  const rim=cyl(10.22,10.22,.08,128,edgeMat);
  rim.position.y=.22; root.add(rim);
  const rim2=cyl(9.0,9.0,.04,128,MAT.edgeGlow);
  rim2.position.y=.22; root.add(rim2);

  // Step up ring
  const step=cyl(10.4,.1,10.8,64,MAT.platform);
  step.position.y=.07; root.add(step);

  // Columns around perimeter
  for(let i=0;i<12;i++){
    const a=i/12*TAU;
    const colGroup=new THREE.Group();
    colGroup.position.set(Math.sin(a)*11.8,0,Math.cos(a)*11.8);
    // Base
    addTo(colGroup, Object.assign(cyl(.35,.42,.5,8,MAT.column),{position:new THREE.Vector3(0,.25,0)}));
    // Shaft
    addTo(colGroup, Object.assign(cyl(.25,.28,4.5,8,MAT.column),{position:new THREE.Vector3(0,2.75,0)}));
    // Capital
    addTo(colGroup, Object.assign(cyl(.42,.28,.4,8,MAT.column),{position:new THREE.Vector3(0,5.2,0)}));
    // Glow strip on column
    const gs=cyl(.27,.27,4.2,8,isDeath?MAT.edgeGlowRed:MAT.edgeGlow);
    gs.position.y=2.75; gs.scale.x=gs.scale.z=.3;
    colGroup.add(gs);
    root.add(colGroup);
  }

  // Arch structure (front + back)
  for(const az of [-13.5,13.5]){
    const arch=new THREE.Group(); arch.position.z=az;
    // Pillars
    for(const ax of [-5,5]){
      const p=cyl(.4,.4,6,8,MAT.column); p.position.set(ax,3,0); arch.add(p);
    }
    // Lintel
    const lin=box(11,.6,.8,MAT.column); lin.position.set(0,6.3,0); arch.add(lin);
    // Glow under lintel
    const gl=box(10,.1,.4,isDeath?MAT.edgeGlowRed:MAT.edgeGlow);
    gl.position.set(0,6.05,0); arch.add(gl);
    root.add(arch);
  }

  // City backdrop ring
  buildCityscape(root);

  // Crowd stands
  buildCrowd(root);

  // Holoboard
  buildHoloboard(root);

  return root;
}

function buildCityscape(root){
  const buildings=[
    {x:-28,z:-30,w:5,h:22,d:5},{x:-22,z:-28,w:3,h:16,d:3},
    {x:-18,z:-32,w:4,h:28,d:4},{x:-12,z:-29,w:3,h:18,d:3},
    {x:-8,z:-31,w:2.5,h:12,d:2.5},{x:8,z:-31,w:2.5,h:14,d:2.5},
    {x:12,z:-29,w:3,h:20,d:3},{x:18,z:-32,w:4,h:26,d:4},
    {x:22,z:-28,w:3,h:14,d:3},{x:28,z:-30,w:5,h:24,d:5},
    {x:-35,z:-20,w:6,h:18,d:6},{x:35,z:-20,w:6,h:20,d:6},
    {x:-40,z:-10,w:5,h:14,d:5},{x:40,z:-10,w:5,h:16,d:5},
  ];
  for(const b of buildings){
    const bm=box(b.w,b.h,b.d,MAT.city);
    bm.position.set(b.x,b.h/2-2,b.z); root.add(bm);
    // Window lights
    const wrows=Math.floor(b.h/2.5);
    for(let r=0;r<wrows;r++){
      if(Math.random()<.6){
        const wm=box(b.w*.7,.15,b.d+.05,MAT.cityLit);
        wm.position.set(b.x,b.h*(.2+r/wrows*.7)-2,b.z); root.add(wm);
      }
    }
  }
}

function buildCrowd(root){
  for(let i=0;i<80;i++){
    const a=rnd(0,TAU);
    const r=rnd(11.5,16);
    const x=Math.sin(a)*r, z=Math.cos(a)*r;
    if(z>8) continue; // don't crowd in front of player
    const tier=Math.floor(rnd(0,3));
    const hh=rnd(.9,1.4);
    const cg=new THREE.Group();
    cg.position.set(x,tier*.8,z);
    // body
    const body=box(.3,hh*.5,.2,MAT.crowd); body.position.y=hh*.25; cg.add(body);
    // head
    const head=sphere(.12,6,MAT.crowd); head.position.y=hh*.58; cg.add(head);
    cg.userData={baseY:cg.position.y, phase:rnd(0,TAU), spd:rnd(1.5,3)};
    root.add(cg);
  }
}

function buildHoloboard(root){
  // Frame
  const frame=new THREE.Group(); frame.position.set(0,7.5,12);
  const backing=box(5.5,1.2,.08,new THREE.MeshStandardMaterial({color:0x060e1c,roughness:.9,metalness:.2}));
  frame.add(backing);
  // Glow border
  for(const [x,y,w,h] of [[-2.75,0,.08,1.2],[2.75,0,.08,1.2],[0,.6,5.5,.08],[0,-.6,5.5,.08]]){
    const b=box(w,h,.1,MAT.edgeGlowRed); b.position.set(x,y,.05); frame.add(b);
  }
  // Holographic text plane (emissive)
  const txtMat=new THREE.MeshStandardMaterial({

// ── Blaster bolt pool ────────────────────────────────────
const BOLT_POOL=[];
function getBolt(){
  let b=BOLT_POOL.find(x=>!x.active);
  if(!b){
    const g=new THREE.Group();
    const core=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.5,8),MAT.boltCore);
    core.rotation.x=Math.PI/2; g.add(core);
    const glow=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.45,8),MAT.bolt);
    glow.rotation.x=Math.PI/2; g.add(glow);
    const light=new THREE.PointLight(0xff6600,4,3);
    g.add(light);
    g.active=false; g.visible=false;
    scene.add(g); BOLT_POOL.push(g); b=g;
  }
  return b;
}

function fireBolt(from,to,onLand,friendly=true){
  const b=getBolt();
  b.active=true; b.visible=true;
  const start=from.clone(); const end=to.clone();
  b.position.copy(start);
  b.lookAt(end);
  const dist=start.distanceTo(end);
  const dur=dist*.04; // ~0.04s per unit
  let t=0;
  b.userData={start,end,dist,dur,t,onLand,friendly};
  activeBolts.push(b);
}
const activeBolts=[];

function updateBolts(dt){
  for(let i=activeBolts.length-1;i>=0;i--){
    const b=activeBolts[i];
    b.userData.t+=dt;
    const k=clamp(b.userData.t/b.userData.dur,0,1);
    b.position.lerpVectors(b.userData.start,b.userData.end,k);
    if(k>=1){
      b.active=false; b.visible=false;
      activeBolts.splice(i,1);
      b.userData.onLand&&b.userData.onLand();
    }
  }
}

// ── Hit sparks ───────────────────────────────────────────
const SPARKS=[];
function spawnSparks(pos,n=18,col=0xff8840){
  for(let i=0;i<n;i++){
    const s=sphere(.03,4,new THREE.MeshStandardMaterial({
      color:col,emissive:new THREE.Color(col),emissiveIntensity:6,roughness:0}));
    s.position.copy(pos);
    s.userData={v:new THREE.Vector3(rnd(-4,4),rnd(1,6),rnd(-4,4)),life:rnd(.3,.6),t:0};
    scene.add(s); SPARKS.push(s);
  }
  // Flash point light
  const fl=new THREE.PointLight(col,8,3);
  fl.position.copy(pos); scene.add(fl);
  fl.userData={t:0,life:.15};
  SPARKS.push(fl);
}

function updateSparks(dt){
  for(let i=SPARKS.length-1;i>=0;i--){
    const s=SPARKS[i];
    s.userData.t+=dt;
    if(s.userData.t>s.userData.life){
      scene.remove(s); if(s.geometry) s.geometry.dispose();
      SPARKS.splice(i,1); continue;
    }
    const k=1-s.userData.t/s.userData.life;
    if(s.userData.v){
      s.userData.v.y-=12*dt;
      s.position.addScaledVector(s.userData.v,dt);
      s.scale.setScalar(k);
    } else {
      s.intensity=8*k; // point light fade
    }
  }
}

// ── d20 Combat engine ────────────────────────────────────
const S={
  // player
  php:80, phmax:80, patk:5, pdef:14, pdmg:{n:1,s:8,b:2},
  pshields:1, pmedpacs:2, pshieldHp:0, pgcd:0, pdodge:0,
  // bendak
  bhp:120, bhmax:120, batk:9, bdef:18, bdmg:{n:2,s:8,b:3},
  bshields:1, bmedpacs:2, bshieldHp:0,
  // fight
  over:false, playerWon:false, countdown:2.0,
  aiNext:2.2, aiGrenadeUsed:false, aiDodgeUsed:false,
  bendakLunge:0, playerFlinch:0, bendakFlinch:0,
  bendakKo:0,
};
const CDS=[0,0,0,0,0,0]; // per ability
const AB_CD=[0,6,8,1,5,5];
const AB_GCD=[1.4,1.4,1.6,.6,.8,.3];
let paused=false;
let queued=null;
let flash=0; // damage flash intensity

function roll(atk,def,mod){
  const r=d20(); const tot=r+atk+mod;
  const hit=r===20||(r!==1&&tot>=def);
  const crit=r>=19;
  return{r,tot,hit,crit};
}
function rollDmg(n,s,b,mul){
  let v=0; for(let i=0;i<n;i++) v+=d(s); return (v+b)*mul|0;
}

function playerFire(mod,mul,label,extra){
  const aim=new THREE.Vector3(
    bendak.position.x+rnd(-.15,.15),
    1.7+rnd(-.2,.3),
    bendak.position.z);
  const from=new THREE.Vector3(0,1.6,7);
  bendak.userData.muzzleLight&&(bendak.userData.muzzleLight.intensity=8);
  fireBolt(from,aim,()=>{
    if(S.over) return;
    const r=roll(S.patk,S.bdef+(S.bdodge>0?6:0),mod);
    if(r.hit){
      let dmg=rollDmg(1,8,2,mul);
      if(S.bshieldHp>0){
        const abs=Math.min(S.bshieldHp,dmg); S.bshieldHp-=abs; dmg-=abs;
      }
      S.bhp=clamp(S.bhp-dmg,0,S.bhmax);
      S.bendakFlinch=.3;
      spawnSparks(aim,dmg>10?28:16);
      cameraShake(.04);
      addLog(`<span class="${r.crit?'lcrit':'lhit'}">${label}: ${r.r}+${S.patk+mod}=${r.tot} vs ${S.bdef} — ${r.crit?'CRITICAL! ':''}${dmg} dmg</span>`);
      if(extra) setTimeout(()=>{ if(!S.over) playerFire(mod,mul,label); },260);
    } else {
      addLog(`<span class="lmiss">${label}: ${r.tot} vs ${S.bdef} — miss</span>`);
    }
    checkEnd();
  }, true);
  bendak.userData.muzzleLight&&setTimeout(()=>bendak.userData.muzzleLight.intensity=0,120);
}

// Abilities
const ABILITIES=[
  {can:()=>true, exec(){playerFire(0,1,'Blaster Shot');}},
  {can:()=>true, exec(){playerFire(-2,2,'Power Blast');}},
  {can:()=>true, exec(){playerFire(-4,1,'Rapid Shot',true);}},
  {can:()=>S.pshields>0&&S.pshieldHp<=0, exec(){
    S.pshields--; S.pshieldHp=30;
    addLog('<span class="lsys">Energy shield activated — 30 absorption.</span>');
  }},
  {can:()=>S.pmedpacs>0&&S.php<S.phmax, exec(){
    S.pmedpacs--; const h=20+d(10); S.php=clamp(S.php+h,0,S.phmax);
    addLog(`<span class="lsys">Medpac: +${h} vitality.</span>`);
  }},
  {can:()=>true, exec(){
    S.pdodge=1.5;
    addLog('<span class="lsys">Dodge — +6 Defense for 1.5s.</span>');
  }},
];

function tryAbility(i){
  if(S.over||S.countdown>0) return;
  const a=ABILITIES[i];
  if(CDS[i]>0||S.pgcd>0||!a.can()) return;
  if(paused){ queued=i; addLog('<span class="lsys">Queued (unpause to execute).</span>'); return; }
  CDS[i]=AB_CD[i]; S.pgcd=AB_GCD[i];
  a.exec();
}
window.tryAbility=tryAbility;

// AI
function aiTick(dt){
  S.aiNext-=dt;
  if(S.aiNext>0||S.over||S.countdown>0) return;
  S.aiNext=1.7*rnd(.8,1.25);

  // Priority: heal < 30%
  if(S.bhp<S.bhmax*.3&&S.bmedpacs>0){
    S.bmedpacs--; const h=20+d(10); S.bhp=clamp(S.bhp+h,0,S.bhmax);
    addLog(`<span class="lsys">Bendak slams a medpac: +${h}.</span>`); return;
  }
  // Shield < 55%
  if(S.bhp<S.bhmax*.55&&S.bshields>0&&S.bshieldHp<=0){
    S.bshields--; S.bshieldHp=30;
    addLog(`<span class="lsys">Bendak's energy shield crackles to life!</span>`); return;
  }
  // Grenade once below 50%
  if(!S.aiGrenadeUsed&&S.bhp<S.bhmax*.5){
    S.aiGrenadeUsed=true;
    addLog('<span class="lann">Bendak reaches for something non-regulation...</span>');
    S.bendakLunge=.4;
    setTimeout(()=>{
      if(S.over) return;
      let dmg=d(6)+d(6)+4;
      if(S.pshieldHp>0){const abs=Math.min(S.pshieldHp,dmg);S.pshieldHp-=abs;dmg-=abs;}
      S.php=clamp(S.php-dmg,0,S.phmax); flash=1; S.playerFlinch=.4;
      cameraShake(.18);
      addLog(`<span class="lcrit">FRAG GRENADE — ${dmg} damage!</span>`);
      spawnSparks(new THREE.Vector3(0,1.4,7),32,0xff4400);
      checkEnd();
    },700); return;
  }
  // Attack
  const p=Math.random();
  let mod=0,mul=1,label='Blaster Shot';
  if(p<.3){mod=-2;mul=2;label='Power Blast';}
  else if(p<.45){mod=-4;label='Rapid Shot';}
  bendakShoot(mod,mul,label);
  if(mod===-4) setTimeout(()=>{if(!S.over) bendakShoot(-4,1,'Rapid Shot');},260);
}

function bendakShoot(mod,mul,label){
  S.bendakLunge=.35;
  const from=new THREE.Vector3(
    bendak.position.x,
    bendak.position.y+1.7,
    bendak.position.z);
  const to=new THREE.Vector3(rnd(-.1,.1),1.5+rnd(-.15,.15),7);
  fireBolt(from,to,()=>{
    if(S.over) return;
    const def=S.pdef+(S.pdodge>0?6:0);
    const r=roll(S.batk,def,mod);
    if(r.hit){
      let dmg=rollDmg(2,8,3,mul);
      if(S.pshieldHp>0){const abs=Math.min(S.pshieldHp,dmg);S.pshieldHp-=abs;dmg-=abs;}
      S.php=clamp(S.php-dmg,0,S.phmax); flash=clamp(dmg/40,0,1); S.playerFlinch=.35;
      cameraShake(.06+dmg*.003);
      addLog(`<span class="${r.crit?'lcrit':'lhit'}">Bendak — ${label}: ${r.r}+${S.batk+mod}=${r.tot} vs ${def} — ${r.crit?'CRITICAL! ':''}${dmg} dmg</span>`);
      spawnSparks(new THREE.Vector3(rnd(-.2,.2),1.5+rnd(-.2,.2),6.5),14,0x5ee0ff);
    } else {
      addLog(`<span class="lmiss">Bendak — ${label}: ${r.tot} vs ${def} — miss</span>`);
    }
    checkEnd();
  }, false);
}

function checkEnd(){
  if(S.over) return;
  if(S.bhp<=0){S.over=true; S.playerWon=true; setTimeout(showWin,2200);}
  else if(S.php<=0){S.over=true; setTimeout(showLose,2200);}
}

let shakeAmt=0;
function cameraShake(a){ shakeAmt=Math.max(shakeAmt,a); }
const camBase=new THREE.Vector3(0,1.75,7);
const camBaseQ=new THREE.Euler(0,0,0);

// ── Bendak animations ─────────────────────────────────────
function animBendak(t,dt){
  if(!bendak) return;
  const {helm}=bendak.userData;

  // Idle: approach player over time
  if(!S.over){
    const targetZ=clamp(bendak.position.z+.4,2.5,5.5); // walk forward
    bendak.position.z+=(targetZ-bendak.position.z)*dt*.15;
    // Bob
    bendak.position.y=Math.sin(t*1.8)*.025;
    // Head look (visor tracks player)
    if(helm) helm.rotation.y=Math.sin(t*.4)*.06;
  }

  // Lunge on attack
  if(S.bendakLunge>0){
    S.bendakLunge=Math.max(0,S.bendakLunge-dt);
    const k=Math.sin(S.bendakLunge/0.35*Math.PI);
    bendak.position.z+=k*.6*dt*60; // lurch forward
  }

  // Flinch
  if(S.bendakFlinch>0){
    S.bendakFlinch=Math.max(0,S.bendakFlinch-dt);
    const k=S.bendakFlinch/.3;
    bendak.position.z+=(k*.8)*dt*60;
    if(helm) helm.rotation.x=k*.15;
  }

  // KO
  if(S.bendakKo>0){
    S.bendakKo=Math.min(1,S.bendakKo+dt*1.2);
    bendak.rotation.x=S.bendakKo*Math.PI*.48;
    bendak.position.y=-S.bendakKo*.6;
  } else if(S.over&&S.playerWon){
    S.bendakKo=0.001;
  }

  // Player cooldowns
  if(!paused&&S.countdown<=0){
    for(let i=0;i<6;i++) CDS[i]=Math.max(0,CDS[i]-dt);
    S.pgcd=Math.max(0,S.pgcd-dt);
    S.pdodge=Math.max(0,S.pdodge-dt);
  }
  if(S.countdown>0) S.countdown-=dt;
  if(S.countdown<=0&&S.countdown>-dt){ addLog('<span class="lann">"FIGHT!"</span>'); }
  aiTick(dt);
}

function animCamera(t,dt){
  // Shake decay
  shakeAmt=Math.max(0,shakeAmt-dt*3.5);
  const sx=rnd(-shakeAmt,shakeAmt), sy=rnd(-shakeAmt,shakeAmt);
  camera.position.set(camBase.x+sx, camBase.y+sy, camBase.z);
  // Breathing
  camera.position.y+=Math.sin(t*1.1)*.008;
  // Player flinch: camera tilts back
  if(S.playerFlinch>0){
    S.playerFlinch=Math.max(0,S.playerFlinch-dt);
    camera.rotation.x=S.playerFlinch*.08;
  } else {
    camera.rotation.x*=.88;
  }
  // Look at Bendak
  const tgt=new THREE.Vector3(bendak.position.x,1.6,bendak.position.z);
  camera.lookAt(tgt);
}

// ── Screens ───────────────────────────────────────────────
function showTitle(){
  document.getElementById('overlay').classList.remove('gone');
  document.getElementById('screen').innerHTML=`
    <h2>TARIS · UPPER CITY</h2>
    <h1>DEATH MATCH</h1>
    <div class="sub">Off the books. No yields, no medics, no witnesses.
    You asked for this fight.<br><br>
    The retired legend <b>Bendak Starkiller</b> is waiting across the ring.
    He's never lost. He doesn't plan to start now.</div>
    <div class="stat-row">
      <div class="stat">ATK <b>+5</b></div>
      <div class="stat">DEF <b>14</b></div>
      <div class="stat">HP <b>80</b></div>
      <div class="stat">💉 <b>×2</b></div>
      <div class="stat">🛡 <b>×1</b></div>
    </div>
    <button class="btn" onclick="startFight()">ENTER THE RING</button>
    <div class="hint">
      <kbd>1</kbd> Blaster &nbsp;
      <kbd>2</kbd> Power Blast &nbsp;
      <kbd>3</kbd> Rapid Shot &nbsp;
      <kbd>4</kbd> Shield &nbsp;
      <kbd>5</kbd> Medpac &nbsp;
      <kbd>Q</kbd> Dodge &nbsp;
      <kbd>Space</kbd> Tactical Pause
    </div>`;
}

function showWin(){
  document.getElementById('overlay').classList.remove('gone');
  document.getElementById('screen').innerHTML=`
    <h2>DEATH MATCH — OVER</h2>
    <h1>BENDAK FALLS</h1>
    <div class="sub">The arena goes silent for exactly two seconds.<br>
    Then it erupts. You just did what no one has done in twenty years.<br><br>
    Somewhere in the crowd, someone starts a rumour about a Jedi.
    They're not entirely wrong about the Force part.</div>
    <button class="btn" onclick="resetFight()">FIGHT AGAIN</button>`;
}

function showLose(){
  document.getElementById('overlay').classList.remove('gone');
  document.getElementById('screen').innerHTML=`
    <h2>DEATH MATCH — OVER</h2>
    <h1 style="color:#ff5e5e">YOU FALL</h1>
    <div class="sub">Bendak stands over you. He doesn't gloat.
    He just holsters his blaster and walks out.<br><br>
    Some legends stay legends for a reason.</div>
    <button class="btn" onclick="resetFight()">TRY AGAIN</button>`;
}

window.startFight=function(){
  document.getElementById('overlay').classList.add('gone');
  addLog('<span class="lann">"The challenger… and the LEGEND — Bendak Starkiller!"</span>');
  addLog('<span class="lsys">DEATH MATCH RULES: No yields. Win or die.</span>');
};
window.resetFight=function(){
  // Reset state
  Object.assign(S,{
    php:80,phmax:80,patk:5,pdef:14,
    bhp:120,bhmax:120,batk:9,bdef:18,
    bshields:1,bmedpacs:2,bshieldHp:0,
    pshields:1,pmedpacs:2,pshieldHp:0,pgcd:0,pdodge:0,
    over:false,playerWon:false,countdown:2.0,
    aiNext:2.2,aiGrenadeUsed:false,bendakLunge:0,
    playerFlinch:0,bendakFlinch:0,bendakKo:0,
  });
  for(let i=0;i<6;i++) CDS[i]=0;
  paused=false; queued=null; flash=0;
  bendak.position.set(0,0,0); bendak.rotation.set(0,Math.PI,0);
  document.getElementById('log').innerHTML='';
  document.getElementById('overlay').classList.add('gone');
  addLog('<span class="lann">"One more time! The crowd demands BLOOD!"</span>');
};

// ── Input ────────────────────────────────────────────────
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();togglePause();return;}
  const map={'1':0,'2':1,'3':2,'4':3,'5':4,'q':5,'Q':5};
  const i=map[e.key]; if(i!==undefined) tryAbility(i);
});
function togglePause(){
  if(S.over||S.countdown>0) return;
  paused=!paused;
  document.getElementById('pausebanner').style.display=paused?'flex':'none';
  if(!paused&&queued!==null){const q=queued;queued=null;tryAbility(q);}
}

// ── Main loop ─────────────────────────────────────────────
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  const t=now/1000;

  if(!paused){
    animBendak(t,dt);
    animCamera(t,dt);
    animCrowd(t);
    updateBolts(dt);
    updateSparks(dt);
    flash=Math.max(0,flash-dt*3.5);
  }
  syncHud();
  composer.render();
  requestAnimationFrame(frame);
}

// ── Boot ─────────────────────────────────────────────────
buildArena();
buildLights();
const bendak=buildBendak();
bendak.rotation.y=Math.PI; // face player
bendak.position.set(0,0,1.5);
collectCrowd();
showTitle();
requestAnimationFrame(frame);
</script>
