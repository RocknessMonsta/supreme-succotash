<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;
  font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;}
#c{display:block;width:100vw;height:100vh;cursor:crosshair;}

/* ── LOADING ─────────────────────────────────────── */
#loading{position:fixed;inset:0;z-index:50;background:#04080f;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5em;}
#loading h2{color:#e8c558;font-size:clamp(18px,3vw,32px);letter-spacing:.25em;font-weight:800;}
#loading p{color:#5ee0ff;font-size:clamp(11px,1.4vw,16px);letter-spacing:.15em;}
#loadbar{width:min(380px,70vw);height:4px;background:#0d1e2e;border-radius:2px;overflow:hidden;}
#loadfill{height:100%;background:linear-gradient(90deg,#e8c558,#ff7040);
  width:0%;transition:width .2s;border-radius:2px;}
#loading.gone{display:none;}

/* ── HUD ─────────────────────────────────────────── */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;}

#xhair{position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);width:20px;height:20px;opacity:.75;}
#xhair::before,#xhair::after{content:'';position:absolute;background:#ff8040;border-radius:1px;}
#xhair::before{width:2px;height:100%;left:50%;transform:translateX(-50%);}
#xhair::after{width:100%;height:2px;top:50%;transform:translateY(-50%);}
.xdot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:3px;height:3px;background:#ff8040;border-radius:50%;}

.hpblock{position:absolute;top:3%;width:clamp(180px,28vw,320px);
  padding:.55em .8em;background:rgba(4,9,18,.88);
  border:1px solid rgba(94,224,255,.28);border-radius:8px;backdrop-filter:blur(6px);}
#hbL{left:2%;}#hbR{right:2%;}
.hpname{font-weight:700;font-size:clamp(11px,1.4vw,16px);letter-spacing:.05em;color:#cfe6f5;}
.hptag{font-size:clamp(8px,.85vw,11px);color:#618496;font-style:italic;margin-top:1px;}
.hpbar{height:8px;margin-top:5px;background:#0b1b28;border-radius:4px;overflow:hidden;position:relative;}
.hpfill{height:100%;border-radius:4px;transition:width .18s;}
.hpfill.g{background:linear-gradient(90deg,#2fb857,#7dff8a);}
.hpfill.r{background:linear-gradient(90deg,#c43030,#ff6040);}
.hpfill.s{background:linear-gradient(90deg,#3ab8cc,#5ee0ff);position:absolute;top:0;left:0;height:100%;}
.hpnum{font-size:clamp(8px,.82vw,11px);color:#6a9db0;margin-top:3px;}

#bar{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);
  display:flex;gap:.4em;pointer-events:all;}
.ab{position:relative;width:clamp(48px,6.8vw,78px);aspect-ratio:1;
  background:rgba(4,9,18,.9);border:1px solid rgba(94,224,255,.3);
  border-radius:9px;cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#cfe6f5;transition:border-color .12s,transform .07s;}
.ab:active{transform:scale(.92);}
.ab:hover{border-color:rgba(232,197,88,.75);}
.ab .ico{font-size:clamp(15px,2.3vw,26px);}
.ab .lbl{font-size:clamp(6px,.65vw,9px);margin-top:2px;letter-spacing:.04em;}
.ab .hk{position:absolute;top:3px;left:5px;font-size:clamp(7px,.7vw,10px);color:#e8c558;font-weight:700;}
.ab .ct{position:absolute;top:3px;right:5px;font-size:clamp(7px,.7vw,10px);color:#5ee0ff;font-weight:700;}
.ab .cdm{position:absolute;bottom:0;left:0;width:100%;background:rgba(2,5,12,.82);pointer-events:none;}
.ab.off{opacity:.3;cursor:default;}

#log{position:absolute;bottom:3%;left:2%;width:28%;max-height:22%;
  overflow:hidden;display:flex;flex-direction:column-reverse;
  font-size:clamp(8px,.95vw,13px);pointer-events:none;}
#log div{padding:2px 0;text-shadow:0 1px 3px #000;animation:lf 7s forwards;}
@keyframes lf{0%{opacity:1}60%{opacity:.9}100%{opacity:0}}
.lh{color:#ffd27d}.lm{color:#7d9bb0}.lc{color:#ff7d7d;font-weight:700}
.ls{color:#5ee0ff}.la{color:#e8c558;font-style:italic}

#flash{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at 50% 40%,rgba(255,50,30,.7) 0%,transparent 70%);}
#slowmo{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at 50% 50%,transparent 30%,rgba(4,9,18,.6) 100%);}
#vign{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 52%,rgba(0,0,0,.65) 100%);}

#pbanner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(2,5,12,.55);pointer-events:none;}
#pbanner span{font-size:clamp(20px,3.5vw,48px);font-weight:800;letter-spacing:.35em;
  color:#5ee0ff;text-shadow:0 0 30px rgba(94,224,255,.5);
  border-top:1px solid rgba(94,224,255,.4);border-bottom:1px solid rgba(94,224,255,.4);
  padding:.3em 1.2em;}

#hitmkr{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  pointer-events:none;opacity:0;font-size:clamp(11px,1.3vw,16px);
  color:#ff8040;font-weight:700;letter-spacing:.1em;text-shadow:0 0 12px #ff6020;}

/* ── OVERLAY SCREENS ─────────────────────────────── */
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;
  justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:radial-gradient(ellipse at 50% 25%,#0e1d32 0%,#040810 80%);}
#overlay.gone{display:none;}
.screen{width:min(94%,800px);text-align:center;padding:2em 1.5em 3em;}
h1{font-size:clamp(28px,5.5vw,68px);letter-spacing:.1em;color:#e8c558;font-weight:800;
  text-shadow:0 0 45px rgba(232,197,88,.4);}
h2{font-size:clamp(11px,1.4vw,17px);color:#5ee0ff;letter-spacing:.32em;margin-bottom:.35em;}
.sub{color:#8ab4cc;font-size:clamp(11px,1.2vw,15px);max-width:560px;
  margin:.8em auto 1.6em;line-height:1.65;}
.btn{display:inline-block;margin:.35em;padding:.65em 2em;
  background:linear-gradient(180deg,#14263a,#0b1726);color:#e8c558;
  border:1px solid rgba(94,224,255,.33);border-radius:8px;
  font-size:clamp(12px,1.3vw,17px);letter-spacing:.1em;cursor:pointer;
  font-weight:700;transition:border-color .14s,transform .07s;pointer-events:all;}
.btn:hover{border-color:#e8c558;}.btn:active{transform:scale(.95);}
.btn.danger{color:#ff5e5e;border-color:rgba(255,94,94,.3);}
.btn.danger:hover{border-color:#ff5e5e;}
kbd{background:#14263a;border:1px solid rgba(94,224,255,.3);border-radius:4px;
  padding:1px 6px;color:#5ee0ff;font-family:inherit;}
.hint{color:#3d5f76;font-size:clamp(9px,.95vw,12px);margin-top:1.6em;line-height:2;}
.stats{display:flex;gap:.6em;justify-content:center;flex-wrap:wrap;margin:.8em 0;}
.stat{background:rgba(8,16,28,.8);border:1px solid rgba(94,224,255,.22);
  border-radius:7px;padding:.35em .8em;color:#9fc6dd;font-size:clamp(10px,1.1vw,14px);}
.stat b{color:#e8c558;}

#rotHint{display:none;position:fixed;inset:0;z-index:99;background:#04080f;
  color:#5ee0ff;font-size:22px;font-weight:700;align-items:center;justify-content:center;
  text-align:center;flex-direction:column;gap:1em;padding:2em;}
@media(max-width:640px)and(orientation:portrait){#rotHint{display:flex;}}
</style>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {Reflector} from 'three/addons/objects/Reflector.js';

/* ═══════════════════════════════════════════════════════════════
   KOTOR: TARIS DUELING ARENA — BENDAK STARKILLER
   Death Match · First-Person · d20 Under the Hood
   Exceeds the original.
   ═══════════════════════════════════════════════════════════════ */

// ── Utilities ──────────────────────────────────────────────────
const TAU = Math.PI * 2;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rnd   = (a,b) => a + Math.random() * (b - a);
const irnd  = (a,b) => Math.floor(rnd(a, b + 1));
const d     = s => irnd(1, s);
const d20   = () => d(20);

// ── Audio Engine ───────────────────────────────────────────────
let audioCtx = null;
function getAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function makeNoiseBuf(ctx, duration){
  const n = ctx.sampleRate * duration | 0;
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d2 = buf.getChannelData(0);
  for(let i = 0; i < n; i++) d2[i] = Math.random() * 2 - 1;
  return buf;
}
function playBlaster(isPlayer = true){
  const ctx = getAudio(); const t = ctx.currentTime;
  const gain = ctx.createGain();
  gain.connect(ctx.destination);
  // oscillator sweep (the "pew")
  const osc = ctx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(isPlayer ? 680 : 520, t);
  osc.frequency.exponentialRampToValueAtTime(isPlayer ? 90 : 70, t + .18);
  const og = ctx.createGain();
  og.gain.setValueAtTime(.28, t);
  og.gain.exponentialRampToValueAtTime(.001, t + .22);
  osc.connect(og); og.connect(gain);
  // noise crack
  const ns = ctx.createBufferSource(); ns.buffer = makeNoiseBuf(ctx, .06);
  const ng = ctx.createGain();
  ng.gain.setValueAtTime(.18, t); ng.gain.exponentialRampToValueAtTime(.001, t + .06);
  ns.connect(ng); ng.connect(gain);
  // filter
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 3500;
  gain.disconnect(); gain.connect(f); f.connect(ctx.destination);
  osc.start(t); osc.stop(t + .25); ns.start(t);
}
function playImpact(big = false){
  const ctx = getAudio(); const t = ctx.currentTime;
  const ns = ctx.createBufferSource(); ns.buffer = makeNoiseBuf(ctx, .15);
  const f = ctx.createBiquadFilter(); f.type = 'bandpass';
  f.frequency.value = big ? 600 : 1400; f.Q.value = big ? 1.5 : 3;
  const g = ctx.createGain();
  g.gain.setValueAtTime(big ? .55 : .32, t);
  g.gain.exponentialRampToValueAtTime(.001, t + (big ? .25 : .12));
  ns.connect(f); f.connect(g); g.connect(ctx.destination);
  ns.start(t);
  if(big){
    const osc = ctx.createOscillator(); osc.type = 'sine';
    osc.frequency.setValueAtTime(80, t);
    osc.frequency.exponentialRampToValueAtTime(30, t + .25);
    const og = ctx.createGain(); og.gain.setValueAtTime(.35, t);
    og.gain.exponentialRampToValueAtTime(.001, t + .3);
    osc.connect(og); og.connect(ctx.destination);
    osc.start(t); osc.stop(t + .3);
  }
}
function playShieldImpact(){
  const ctx = getAudio(); const t = ctx.currentTime;
  for(let i = 0; i < 3; i++){
    const osc = ctx.createOscillator(); osc.type = 'sine';
    const freq = 1200 + i * 340;
    osc.frequency.setValueAtTime(freq, t + i*.025);
    const g = ctx.createGain();
    g.gain.setValueAtTime(.12, t + i*.025);
    g.gain.exponentialRampToValueAtTime(.001, t + i*.025 + .18);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t + i*.025); osc.stop(t + i*.025 + .22);
  }
}
function playHeal(){
  const ctx = getAudio(); const t = ctx.currentTime;
  [523,659,784,1047].forEach((f,i) => {
    const osc = ctx.createOscillator(); osc.type = 'sine';
    osc.frequency.value = f;
    const g = ctx.createGain();
    g.gain.setValueAtTime(.15, t + i*.08);
    g.gain.exponentialRampToValueAtTime(.001, t + i*.08 + .2);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t + i*.08); osc.stop(t + i*.08 + .25);
  });
}
function playCrowd(){
  const ctx = getAudio(); const t = ctx.currentTime;
  const ns = ctx.createBufferSource(); ns.buffer = makeNoiseBuf(ctx, 1.5);
  const f = ctx.createBiquadFilter(); f.type = 'bandpass';
  f.frequency.value = 800; f.Q.value = .4;
  const g = ctx.createGain();
  g.gain.setValueAtTime(.0, t);
  g.gain.linearRampToValueAtTime(.22, t + .3);
  g.gain.linearRampToValueAtTime(.18, t + .9);
  g.gain.linearRampToValueAtTime(.0, t + 1.5);
  ns.connect(f); f.connect(g); g.connect(ctx.destination);
  ns.start(t);
}
function playExplosion(){
  const ctx = getAudio(); const t = ctx.currentTime;
  const ns = ctx.createBufferSource(); ns.buffer = makeNoiseBuf(ctx, .6);
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 400;
  const g = ctx.createGain();
  g.gain.setValueAtTime(.9, t); g.gain.exponentialRampToValueAtTime(.001, t + .6);
  ns.connect(f); f.connect(g); g.connect(ctx.destination); ns.start(t);
  const osc = ctx.createOscillator(); osc.type = 'sine';
  osc.frequency.setValueAtTime(120, t);
  osc.frequency.exponentialRampToValueAtTime(25, t + .5);
  const og = ctx.createGain(); og.gain.setValueAtTime(.6, t);
  og.gain.exponentialRampToValueAtTime(.001, t + .5);
  osc.connect(og); og.connect(ctx.destination); osc.start(t); osc.stop(t + .5);
}

// Ambient tension music drone
let ambientStarted = false;
function startAmbient(){
  if(ambientStarted) return; ambientStarted = true;
  const ctx = getAudio();
  const masterGain = ctx.createGain(); masterGain.gain.value = .12;
  masterGain.connect(ctx.destination);
  // Low drone: two slightly detuned oscillators
  [[55,.06],[55.5,.04],[110,.03],[82.4,.025]].forEach(([freq, vol]) => {
    const osc = ctx.createOscillator(); osc.type = 'sine';
    osc.frequency.value = freq;
    const g = ctx.createGain(); g.gain.value = vol;
    osc.connect(g); g.connect(masterGain); osc.start();
  });
  // Tension pulse every ~3.5s
  const pulse = () => {
    if(!audioCtx || audioCtx.state !== 'running') return;
    const t = ctx.currentTime;
    const osc = ctx.createOscillator(); osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, t);
    osc.frequency.exponentialRampToValueAtTime(110, t + 1.2);
    const g = ctx.createGain(); g.gain.setValueAtTime(.0, t);
    g.gain.linearRampToValueAtTime(.04, t + .1);
    g.gain.exponentialRampToValueAtTime(.001, t + 1.2);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 600;
    osc.connect(f); f.connect(g); g.connect(masterGain);
    osc.start(t); osc.stop(t + 1.3);
    setTimeout(pulse, 3200 + Math.random() * 1800);
  };
  setTimeout(pulse, 1000);
}

// ── Three.js Setup ─────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias: true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050a14, 0.014);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, .05, 300);
camera.position.set(0, 1.72, 7.5);

// Post-processing
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .65, .35, .78);
composer.addPass(bloom);

// Custom vignette + chromatic aberration pass
const VigCA = {
  uniforms: {tDiffuse:{value:null}, vig:{value:.85}, ca:{value:.0}},
  vertexShader: `varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float vig; uniform float ca;
    varying vec2 vUv;
    void main(){
      vec2 c=vec2(.5); vec2 dir=(vUv-c)*ca;
      float r=texture2D(tDiffuse,vUv+dir).r;
      float g=texture2D(tDiffuse,vUv).g;
      float b=texture2D(tDiffuse,vUv-dir).b;
      float d=length(vUv-c)*2.;
      float v=smoothstep(1.,.25,d*vig);
      gl_FragColor=vec4(r,g,b,1.)*v;
    }`
};
const vigPass = new ShaderPass(VigCA);
composer.addPass(vigPass);
composer.addPass(new OutputPass());

function resize(){
  const w=innerWidth, h=innerHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h); composer.setSize(w,h);
  bloom.resolution.set(w,h);
}
addEventListener('resize', resize); resize();

// ── Canvas-gen Textures ─────────────────────────────────────────
function makeTex(sz, fn){
  const cv=document.createElement('canvas'); cv.width=cv.height=sz;
  fn(cv.getContext('2d'), cv); return new THREE.CanvasTexture(cv);
}
const floorTex = makeTex(1024, (c, cv) => {
  c.fillStyle = '#101e30'; c.fillRect(0,0,1024,1024);
  c.strokeStyle = 'rgba(50,130,200,.22)'; c.lineWidth = 1.5;
  for(let i=0;i<=1024;i+=128){ c.beginPath();c.moveTo(i,0);c.lineTo(i,1024);c.stroke();
    c.beginPath();c.moveTo(0,i);c.lineTo(1024,i);c.stroke(); }
  c.strokeStyle='rgba(94,224,255,.4)'; c.lineWidth=2;
  c.beginPath(); c.arc(512,512,100,0,TAU); c.stroke();
  c.beginPath(); c.arc(512,512,240,0,TAU); c.stroke();
  for(let a=0;a<8;a++){const ang=a*TAU/8;
    c.beginPath(); c.moveTo(512+Math.cos(ang)*100,512+Math.sin(ang)*100);
    c.lineTo(512+Math.cos(ang)*240,512+Math.sin(ang)*240); c.stroke();}
});
floorTex.wrapS=floorTex.wrapT=THREE.RepeatWrapping; floorTex.repeat.set(3,3);

const wallTex = makeTex(512, (c) => {
  c.fillStyle='#0c1828'; c.fillRect(0,0,512,512);
  c.strokeStyle='rgba(40,80,130,.5)'; c.lineWidth=1;
  for(let i=0;i<512;i+=32){ c.beginPath();c.moveTo(0,i);c.lineTo(512,i);c.stroke();}
  for(let i=0;i<512;i+=64){ c.beginPath();c.moveTo(i,0);c.lineTo(i,512);c.stroke();}
});
wallTex.wrapS=wallTex.wrapT=THREE.RepeatWrapping; wallTex.repeat.set(2,2);

// ── Geometry Helpers ────────────────────────────────────────────
const box=(w,h,d,mat)=>Object.assign(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat),{castShadow:true,receiveShadow:true});
const cyl=(rt,rb,h,seg,mat)=>Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat),{castShadow:true,receiveShadow:true});
const sph=(r,seg,mat)=>Object.assign(new THREE.Mesh(new THREE.SphereGeometry(r,seg,seg),mat),{castShadow:true});

// ── Arena ───────────────────────────────────────────────────────
function buildArena(){
  const root = new THREE.Group(); scene.add(root);

  // Ground plane
  const g = box(200, .02, 200, M.ground);
  g.position.y = -.01; root.add(g);

  // Reflective floor disc
  const refl = new Reflector(new THREE.CircleGeometry(10.2, 96), {
    clipBias: .003,
    textureWidth: Math.min(innerWidth, 1024),
    textureHeight: Math.min(innerHeight, 1024),
    color: 0x1a3050,
    recursion: 1,
  });
  refl.rotation.x = -Math.PI/2; refl.position.y = .02; root.add(refl);

  // Floor texture disc on top of reflector
  const fd = new THREE.Mesh(new THREE.CircleGeometry(10.1, 96), new THREE.MeshStandardMaterial({
    map: floorTex, roughness:.4, metalness:.6, transparent:true, opacity:.55,
    color:0x1a2f48
  }));
  fd.rotation.x = -Math.PI/2; fd.position.y = .03; fd.receiveShadow = true; root.add(fd);

  // Platform step ring
  const step = cyl(10.5, 10.8, .15, 96, M.platform);
  step.position.y = .07; root.add(step);

  // Edge glow ring
  const rim = cyl(10.22, 10.22, .07, 128, M.edgeR);
  rim.position.y = .2; root.add(rim);
  const rim2 = cyl(8.8, 8.8, .03, 128, M.edgeB);
  rim2.position.y = .2; root.add(rim2);

  // Columns
  for(let i = 0; i < 12; i++){
    const a = i/12 * TAU;
    const cg = new THREE.Group();
    cg.position.set(Math.sin(a)*12.5, 0, Math.cos(a)*12.5);
    // Base cap
    cg.add(Object.assign(cyl(.42,.46,.4,8,M.column),{position:new THREE.Vector3(0,.2,0)}));
    // Shaft
    cg.add(Object.assign(cyl(.26,.3,5.2,8,M.column),{position:new THREE.Vector3(0,2.8,0)}));
    // Top cap
    cg.add(Object.assign(cyl(.46,.3,.35,8,M.column),{position:new THREE.Vector3(0,5.55,0)}));
    // Glow strip
    const gs = cyl(.27,.27,4.8,6,M.edgeR); gs.position.y=2.8; gs.scale.x=gs.scale.z=.22; cg.add(gs);
    // Column point light
    const cl = new THREE.PointLight(0xff2200, .8, 6); cl.position.set(0,2,0); cg.add(cl);
    root.add(cg);
  }

  // Entry arches front & back
  for(const az of [-14, 14]){
    const ag = new THREE.Group(); ag.position.z = az;
    [[-5.2,3,0],[5.2,3,0]].forEach(([x,y,z]) => {
      ag.add(Object.assign(cyl(.38,.38,6,8,M.column),{position:new THREE.Vector3(x,y,z)}));
    });
    const lin = box(11.4,.5,.7,M.column); lin.position.y = 6.25; ag.add(lin);
    const gl = box(10.5,.08,.5,M.edgeR); gl.position.y = 6.05; ag.add(gl);
    root.add(ag);
  }

  buildCityscape(root);
  buildCrowd(root);
  buildHoloboard(root);
  return root;
}

function buildCityscape(root){
  const buildings=[
    [-30,-32,5.5,26,5.5],[-24,-30,3.5,18,3.5],[-18,-34,4.5,32,4.5],
    [-11,-31,3,20,3],[-5,-33,2.5,13,2.5],[5,-33,2.5,15,2.5],
    [11,-31,3,22,3],[18,-34,4.5,28,4.5],[24,-30,3.5,16,3.5],[30,-32,5.5,27,5.5],
    [-38,-22,6,20,7],[38,-22,6,22,7],[-44,-12,5.5,16,5],
    [44,-12,5.5,18,5],[-50,-5,5,12,6],[50,-5,5,14,6],
  ];
  for(const [x,z,w,h,dep] of buildings){
    const bm = box(w,h,dep,M.city); bm.position.set(x,h/2-2,z); root.add(bm);
    // Window rows
    const rows = Math.floor(h/3);
    for(let r=0;r<rows;r++){
      if(Math.random()<.55){
        const wm = box(w*.65,.1,dep+.05, Math.random()<.3?M.cityLitB:M.cityLit);
        wm.position.set(x,h*(.15+r/rows*.72)-2,z); root.add(wm);
      }
    }
  }
}

const crowdObjects = [];
function buildCrowd(root){
  for(let i = 0; i < 100; i++){
    const a = rnd(0, TAU);
    const r2 = rnd(12, 18);
    const x = Math.sin(a)*r2, z = Math.cos(a)*r2;
    if(z > 9) continue;
    const tier = Math.floor(rnd(0,3));
    const hh = rnd(.85,1.35);
    const cg = new THREE.Group();
    cg.position.set(x, tier*.85 + .1, z);
    const body = box(.28,hh*.5,.18,new THREE.MeshStandardMaterial({
      color:new THREE.Color().setHSL(rnd(.55,.75),rnd(.2,.4),rnd(.12,.2)), roughness:.9, metalness:0}));
    body.position.y=hh*.25; cg.add(body);
    const head = sph(.11,6,new THREE.MeshStandardMaterial({
      color:new THREE.Color().setHSL(rnd(.05,.12),rnd(.3,.5),rnd(.3,.5)), roughness:.9}));
    head.position.y=hh*.6; cg.add(head);
    cg.lookAt(0, cg.position.y+.5, 0);
    cg.userData = {baseY:cg.position.y, phase:rnd(0,TAU), spd:rnd(1.5,3.2)};
    crowdObjects.push(cg); root.add(cg);
  }
}

function buildHoloboard(root){
  const g = new THREE.Group(); g.position.set(0, 8, 13.5);
  const back = box(6,.9,.06, new THREE.MeshStandardMaterial({color:0x04080f,roughness:.9}));
  g.add(back);
  // Frame glow edges
  for(const [x,y,w,h] of [[-3,0,.06,.9],[3,0,.06,.9],[0,.45,6,.06],[0,-.45,6,.06]]){
    const b = box(w,h,.12,M.edgeR); b.position.set(x,y,.06); g.add(b);
  }
  // Corner brackets
  const bc = .3;
  for(const [sx,sy] of [[-1,1],[1,1],[1,-1],[-1,-1]]){
    const bh = box(.04,bc,.14,M.edgeR); bh.position.set(sx*2.95,sy*.38,.08); g.add(bh);
    const bv = box(bc,.04,.14,M.edgeR); bv.position.set(sx*2.95,sy*.38,.08); g.add(bv);
  }
  scene.add(g);
}

// ── Bolt FX ─────────────────────────────────────────────────────
const activeBolts = [];
function getBolt(){
  const g = new THREE.Group();
  const core = new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,.55,6), M.boltC);
  core.rotation.x = Math.PI/2; g.add(core);
  const glow = new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,.5,6), M.bolt);
  glow.rotation.x = Math.PI/2; g.add(glow);
  const pl = new THREE.PointLight(0xff6600, 5, 2.5); g.add(pl);
  g.visible = false; scene.add(g); return g;
}
const boltPool = Array.from({length:12}, getBolt);

function fireBolt(from, to, onLand){
  const b = boltPool.find(x => !x.visible) || boltPool[0];
  b.visible = true;
  const start = from.clone(); const end = to.clone();
  b.position.copy(start); b.lookAt(end);
  const dur = start.distanceTo(end) * .042;
  b.userData = {start, end, dur, t:0, onLand};
  activeBolts.push(b);
}
function updateBolts(dt){
  for(let i = activeBolts.length-1; i >= 0; i--){
    const b = activeBolts[i]; b.userData.t += dt;
    const k = clamp(b.userData.t / b.userData.dur, 0, 1);
    b.position.lerpVectors(b.userData.start, b.userData.end, k);
    if(k >= 1){
      b.visible = false; activeBolts.splice(i,1);
      b.userData.onLand?.();
    }
  }
}

// ── Spark Particles ─────────────────────────────────────────────
const sparks = [];
function spawnSparks(pos, n=20, col=0xff8840){
  for(let i=0;i<n;i++){
    const s = sph(.022, 4, new THREE.MeshStandardMaterial({
      color:col, emissive:new THREE.Color(col), emissiveIntensity:6, roughness:0}));
    s.position.copy(pos);
    s.userData = {v: new THREE.Vector3(rnd(-5,5),rnd(.5,7),rnd(-5,5)), life:rnd(.25,.55), t:0};
    scene.add(s); sparks.push(s);
  }
  const fl = new THREE.PointLight(col, 10, 3.5);
  fl.position.copy(pos); scene.add(fl);
  fl.userData = {life:.12, t:0, isLight:true};
  sparks.push(fl);
}
function updateSparks(dt){
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i]; s.userData.t+=dt;
    if(s.userData.t>s.userData.life){ scene.remove(s); s.geometry?.dispose(); sparks.splice(i,1); continue; }
    const k = 1-s.userData.t/s.userData.life;
    if(s.userData.isLight){ s.intensity=10*k; }
    else { s.userData.v.y-=15*dt; s.position.addScaledVector(s.userData.v,dt); s.scale.setScalar(k*.8+.2); }
  }
}

// ── d20 Combat Engine ───────────────────────────────────────────
const S = {
  php:80, phmax:80, patk:5, pdef:14, pdodge:0,
  psh:0,  pshmax:30, pmeds:2, pshields:1, pgcd:0,
  bhp:120, bhmax:120, batk:9, bdef:18,
  bsh:0,  bshmax:30, bmeds:2, bshields:1,
  countdown:2.2, aiNext:2.0, grenade:false,
  over:false, playerWon:false, slowMo:false,
  bendakState:'idle', // idle|walk|punch|death
};
const CDS=[0,0,0,0,0,0];
const ABCD=[0,6,8,1,5,5];
const ABGCD=[1.4,1.4,1.6,.6,.8,.3];
let paused=false, queued=null;
let flashAmt=0, caAmt=0;
let shakeAmt=0;

function roll(atk, def, mod){
  const r=d20(); const tot=r+atk+mod;
  const hit=r===20||(r!==1&&tot>=def); const crit=r>=19;
  return{r,tot,hit,crit};
}
function dmg(n,s,b,mul){ let v=0;for(let i=0;i<n;i++) v+=d(s); return (v+b)*mul|0; }

function playerFire(mod, mul, label, extra){
  weaponRecoil = 1;
  muzzleFlashLight.intensity = 12;
  setTimeout(()=>muzzleFlashLight.intensity=0, 80);
  playBlaster(true);
  const from = new THREE.Vector3(); camera.getWorldPosition(from);
  from.z -= .38;
  const aim = new THREE.Vector3(
    bendakObj.position.x + rnd(-.12,.12),
    bendakObj.position.y + 1.5 + rnd(-.25,.25),
    bendakObj.position.z);
  fireBolt(from, aim, () => {
    if(S.over) return;
    const eff = S.bdef + (S.bendakDodge > 0 ? 6 : 0);
    const r = roll(S.patk, eff, mod);
    if(r.hit){
      let raw = dmg(1,8,2,mul);
      let absorbed = 0;
      if(S.bsh > 0){ absorbed = Math.min(S.bsh, raw); S.bsh -= absorbed; raw -= absorbed; playShieldImpact(); }
      S.bhp = clamp(S.bhp-raw, 0, S.bhmax);
      spawnSparks(aim, raw>10?28:16, absorbed>0?0x5ee0ff:0xff8840);
      showHitMarker();
      shakeAmt = Math.max(shakeAmt, .03);
      addLog(`<span class="${r.crit?'lc':'lh'}">${label}: ${r.r}+${S.patk+mod}=${r.tot} vs DEF ${eff}${r.crit?' — CRITICAL!':''} — ${raw} dmg</span>`);
      if(!absorbed) playImpact();
      if(extra) setTimeout(()=>{ if(!S.over) playerFire(mod,mul,label); }, 280);
    } else {
      addLog(`<span class="lm">${label}: ${r.tot} vs DEF ${eff} — miss</span>`);
    }
    checkEnd();
  });
}

const ABILITIES = [
  {can:()=>true, exec(){playerFire(0,1,'Blaster Shot');}},
  {can:()=>true, exec(){playerFire(-2,2,'Power Blast');}},
  {can:()=>true, exec(){playerFire(-4,1,'Rapid Shot',true);}},
  {can:()=>S.pshields>0&&S.psh<=0, exec(){
    S.pshields--; S.psh=S.pshmax; playShieldImpact();
    addLog('<span class="ls">Energy shield active — absorbs 30 damage.</span>');
  }},
  {can:()=>S.pmeds>0&&S.php<S.phmax, exec(){
    S.pmeds--; const h=20+d(10); S.php=clamp(S.php+h,0,S.phmax);
    playHeal();
    addLog(`<span class="ls">Medpac: +${h} vitality.</span>`);
  }},
  {can:()=>true, exec(){
    S.pdodge=1.6;
    addLog('<span class="ls">Dodge — +6 DEF for 1.6s.</span>');
  }},
];
window.tryAbility = i => {
  if(S.over||S.countdown>0) return;
  startAmbient();
  const a=ABILITIES[i];
  if(CDS[i]>0||S.pgcd>0||!a.can()) return;
  if(paused){ queued=i; addLog('<span class="ls">Queued for next frame.</span>'); return; }
  CDS[i]=ABCD[i]; S.pgcd=ABGCD[i]; a.exec();
};

function aiTick(dt){
  S.aiNext -= dt;
  if(S.aiNext > 0||S.over||S.countdown>0) return;
  S.aiNext = 1.65 * rnd(.85,1.2);

  if(S.bhp < S.bhmax*.28 && S.bmeds>0){
    S.bmeds--; const h=20+d(10); S.bhp=clamp(S.bhp+h,0,S.bhmax);
    addLog(`<span class="ls">Bendak slams a medpac: +${h}.</span>`); return;
  }
  if(S.bhp < S.bhmax*.52 && S.bshields>0 && S.bsh<=0){
    S.bshields--; S.bsh=S.bshmax; playShieldImpact();
    addLog('<span class="ls">Bendak\'s shield blazes to life!</span>'); return;
  }
  if(!S.grenade && S.bhp < S.bhmax*.48){
    S.grenade=true;
    addLog('<span class="la">Bendak reaches for something off the rack...</span>');
    S.bendakLunge=.5;
    setTimeout(()=>{
      if(S.over) return;
      playExplosion();
      let raw=d(6)+d(6)+d(6)+3;
      if(S.psh>0){const abs=Math.min(S.psh,raw);S.psh-=abs;raw-=abs;}
      S.php=clamp(S.php-raw,0,S.phmax);
      flashAmt=1; caAmt=.035; shakeAmt=.22;
      spawnSparks(new THREE.Vector3(rnd(-.3,.3),1.4+rnd(-.2,.2),6.8),40,0xff4400);
      addLog(`<span class="lc">FRAG GRENADE — ${raw} damage!</span>`);
      checkEnd();
    },650); return;
  }
  const p=Math.random();
  let mod=0,mul=1,label='Blaster Shot';
  if(p<.28){mod=-2;mul=2;label='Power Blast';}
  else if(p<.44){mod=-4;label='Rapid Shot';}
  bendakFire(mod,mul,label);
  if(mod===-4) setTimeout(()=>{if(!S.over) bendakFire(-4,1,'Rapid Shot');},280);
}

function bendakFire(mod,mul,label){
  if(!bendakObj) return;
  setBendakState('punch');
  playBlaster(false);
  const from=new THREE.Vector3(
    bendakObj.position.x, bendakObj.position.y+1.55, bendakObj.position.z-.2);
  const to=new THREE.Vector3(rnd(-.12,.12),1.6+rnd(-.18,.18),7.5);
  fireBolt(from,to,()=>{
    if(S.over) return;
    const def=S.pdef+(S.pdodge>0?6:0);
    const r=roll(S.batk,def,mod);
    if(r.hit){
      let raw=dmg(2,8,3,mul);
      if(S.psh>0){const abs=Math.min(S.psh,raw);S.psh-=abs;raw-=abs;playShieldImpact();}
      S.php=clamp(S.php-raw,0,S.phmax);
      flashAmt=clamp(raw/35,.15,1); caAmt=clamp(raw/120,.006,.04);
      shakeAmt=Math.max(shakeAmt,.04+raw*.003);
      spawnSparks(new THREE.Vector3(rnd(-.15,.15),1.55+rnd(-.2,.2),6.8),12,0x5ee0ff);
      addLog(`<span class="${r.crit?'lc':'lh'}">Bendak — ${label}: ${r.tot} vs DEF ${def}${r.crit?' — CRITICAL!':''} — ${raw} dmg</span>`);
      if(!S.over) playImpact();
    } else {
      addLog(`<span class="lm">Bendak — ${label}: ${r.tot} vs DEF ${def} — miss</span>`);
    }
    checkEnd();
  });
}

function checkEnd(){
  if(S.over) return;
  if(S.bhp<=0){ S.over=true; S.playerWon=true; startDeathSequence(); }
  else if(S.php<=0){ S.over=true; setBendakState('idle'); setTimeout(showLose,2500); }
}

// ── Bendak Character ────────────────────────────────────────────
let bendakObj=null, bendakMixer=null;
let bendakActions={}, bendakCurAction=null;
const visorLight = new THREE.PointLight(0xff3300, 2, 2.5);
scene.add(visorLight);
let S_bendakLunge=0, S_bendakFlinch=0, S_bendakDodge=0;
S.bendakLunge=0; S.bendakFlinch=0; S.bendakDodge=0;

function setBendakState(name){
  const a=bendakActions[name]; if(!a||bendakCurAction===a) return;
  if(bendakCurAction) bendakCurAction.crossFadeTo(a, name==='death'?.3:.18, true);
  a.reset().play(); bendakCurAction=a; S.bendakState=name;
}

function loadBendak(){
  return new Promise(resolve=>{
    const loader=new GLTFLoader();
    loader.load(
      'https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb',
      gltf=>{
        bendakObj=gltf.scene;
        scene.add(bendakObj);
        bendakObj.position.set(0,0,2.0);
        bendakObj.rotation.y=Math.PI;
        bendakObj.scale.setScalar(1.05);

        // Override materials for gold Mandalorian armor aesthetic
        bendakObj.traverse(child=>{
          if(child.isMesh){
            child.castShadow=true; child.receiveShadow=true;
            const name=(child.name||'').toLowerCase();
            const col=child.material?.color;
            // Eyes/visor = bright emissive red
            const isEye=name.includes('eye')||name.includes('visor')||
              (child.material?.emissiveIntensity>0.5);
            // Joint areas / darker parts
            const isDark=name.includes('joint')||name.includes('lower');
            if(isEye){
              child.material=M.visor.clone();
              child.material.emissiveIntensity=6+Math.sin(Date.now()*.003)*2;
            } else if(isDark || name.includes('body') && Math.random()<.3){
              child.material=M.darkArm.clone();
            } else {
              // Alternate between gold and dark based on mesh index for visual variety
              child.material=(Math.random()<.55?M.goldArm:M.darkArm).clone();
            }
          }
        });

        // Attach visor light to head area
        bendakObj.traverse(child=>{
          if(child.name && child.name.toLowerCase().includes('head')){
            visorLight.position.set(0,.1,-.25);
            child.add(visorLight);
          }
        });

        // Setup animations
        bendakMixer=new THREE.AnimationMixer(bendakObj);
        const anims=gltf.animations;
        anims.forEach(clip=>{
          const action=bendakMixer.clipAction(clip);
          if(['Death','Punch'].includes(clip.name)){
            action.clampWhenFinished=true;
            action.loop=THREE.LoopOnce;
          }
          bendakActions[clip.name]=action;
        });

        // Start idle
        if(bendakActions['Idle']){ bendakActions['Idle'].play(); bendakCurAction=bendakActions['Idle']; }
        resolve();
      },
      xhr => {
        const pct = (xhr.loaded/xhr.total*100)|0;
        document.getElementById('loadfill').style.width=pct+'%';
        document.getElementById('loadtxt').textContent=`LOADING BENDAK... ${pct}%`;
      }
    );
  });
}

// ── Death Sequence ───────────────────────────────────────────────
function startDeathSequence(){
  setBendakState('death');
  S.slowMo=true;
  playCrowd();
  addLog('<span class="la">The arena falls silent for exactly two seconds... then ERUPTS.</span>');
  // Slow motion for cinematic feel
  const slowMoEl=document.getElementById('slowmo');
  slowMoEl.style.transition='opacity .4s'; slowMoEl.style.opacity='1';
  setTimeout(()=>{
    S.slowMo=false;
    slowMoEl.style.transition='opacity 1.2s'; slowMoEl.style.opacity='0';
    showWin();
    playCrowd(); playCrowd();
  }, 3200);
}

// ── Crowd Animation ─────────────────────────────────────────────
function animCrowd(t){
  for(const c of crowdObjects){
    const amp = S.over && S.playerWon ? .2 : .06;
    c.position.y = c.userData.baseY + Math.sin(t*c.userData.spd+c.userData.phase)*amp;
  }
}

// ── Camera ──────────────────────────────────────────────────────
const camBase = new THREE.Vector3(0,1.72,7.5);
function animCamera(t, dt){
  shakeAmt=Math.max(0,shakeAmt-dt*4.5);
  caAmt=Math.max(0,caAmt-dt*.8);
  const sx=rnd(-shakeAmt,shakeAmt)*(!S.slowMo?1:.2);
  const sy=rnd(-shakeAmt,shakeAmt)*(!S.slowMo?1:.2);
  camera.position.set(camBase.x+sx, camBase.y+sy+Math.sin(t*1.1)*.007, camBase.z);
  // Flinch on hit
  vigPass.uniforms.ca.value = caAmt;
  // Look at Bendak
  if(bendakObj){
    const tgt=new THREE.Vector3(bendakObj.position.x*.3, 1.6, bendakObj.position.z);
    camera.lookAt(tgt);
  }
}

// ── Bendak Animation ─────────────────────────────────────────────
function animBendak(t, dt){
  if(!bendakObj) return;
  const spd = S.slowMo ? dt*.15 : dt;

  // Advance toward player
  if(!S.over && S.countdown<=0){
    const targetZ = clamp(bendakObj.position.z + .35, 2.8, 5.8);
    bendakObj.position.z += (targetZ - bendakObj.position.z) * spd * .25;
    // Switch to walking when moving noticeably
    const moving = bendakObj.position.z < 5.5;
    if(moving && S.bendakState==='idle') setBendakState('Walking');
    else if(!moving && S.bendakState==='Walking') setBendakState('Idle');
  }

  // Visor light pulse
  if(visorLight) visorLight.intensity = 2 + Math.sin(t*4)*.6;

  // Idle bob
  if(!S.over) bendakObj.position.y = Math.sin(t*1.6)*.02;

  // Lunge forward on attack
  if(S.bendakLunge>0){
    S.bendakLunge=Math.max(0,S.bendakLunge-dt);
    const k=Math.sin(S.bendakLunge/.35*Math.PI);
    bendakObj.position.z+=k*.5*spd*60;
  }

  // Return to idle after punch
  if(S.bendakState==='punch'){
    const pa=bendakActions['Punch'];
    if(pa && pa.time > 0 && !pa.isRunning()) setBendakState('Walking');
  }

  // Weapon recoil animation
  if(weaponRecoil>0){
    weaponRecoil=Math.max(0,weaponRecoil-dt*8);
    const r=weaponRecoil;
    weaponGroup.position.set(.24,-.26+r*.015*(1-r),-.44-r*.04);
    weaponGroup.rotation.set(.04-r*.08,(.18+r*.02),-.03);
  }

  bendakMixer?.update(S.slowMo ? dt*.18 : dt);
}

// ── HUD Sync ────────────────────────────────────────────────────
function showHitMarker(){
  const hm=document.getElementById('hitmkr');
  hm.style.transition='none'; hm.style.opacity='1';
  setTimeout(()=>{ hm.style.transition='opacity .4s'; hm.style.opacity='0'; },120);
}
function addLog(html){
  const lg=document.getElementById('log');
  const d2=document.createElement('div'); d2.innerHTML=html; lg.prepend(d2);
  while(lg.children.length>7) lg.lastChild.remove();
}
function syncHud(){
  const pp=S.php/S.phmax, psh=S.psh/S.pshmax;
  const bp=S.bhp/S.bhmax, bsh=S.bsh/S.bshmax;
  document.getElementById('phpf').style.width=(pp*100)+'%';
  document.getElementById('phpf').className='hpfill '+(pp>.35?'g':'r');
  document.getElementById('pshf').style.width=(psh*100)+'%';
  document.getElementById('phpn').textContent=`${S.php} / ${S.phmax}`+(S.psh>0?` ⛨${S.psh}`:'');
  document.getElementById('bhpf').style.width=(bp*100)+'%';
  document.getElementById('bshf').style.width=(bsh*100)+'%';
  document.getElementById('bhpn').textContent=`${S.bhp} / ${S.bhmax}`+(S.bsh>0?` ⛨${S.bsh}`:'');
  document.getElementById('sct').textContent='×'+S.pshields;
  document.getElementById('mct').textContent='×'+S.pmeds;
  for(let i=0;i<6;i++){
    const frac=ABCD[i]>0?CDS[i]/ABCD[i]:0;
    document.getElementById('cd'+i).style.height=(frac*100)+'%';
    document.getElementById('ab'+i).classList.toggle('off',
      CDS[i]>0||S.pgcd>0||!ABILITIES[i].can()||S.over||S.countdown>0);
  }
  document.getElementById('flash').style.opacity=flashAmt.toFixed(3);
}

// ── Screens ─────────────────────────────────────────────────────
function showTitle(){
  document.getElementById('overlay').classList.remove('gone');
  document.getElementById('screen').innerHTML=`
    <h2>TARIS · UPPER CITY CANTINA</h2>
    <h1>DEATH MATCH</h1>
    <div class="sub">
      The promoter's message was short. <em>"Off the books. Bendak Starkiller. To the death."</em><br><br>
      He's never lost. Not once. Not in twenty years. You asked for this.
    </div>
    <div class="stats">
      <div class="stat">ATK <b>+5</b></div><div class="stat">DEF <b>14</b></div>
      <div class="stat">HP <b>80</b></div><div class="stat">💉 <b>×2</b></div>
      <div class="stat">🛡 <b>×1</b></div>

      <kbd>Space</kbd> Tactical Pause — freeze time and queue your next action
    </div>`;
}
function showWin(){
  document.getElementById('overlay').classList.remove('gone');
  document.getElementById('screen').innerHTML=`
    <h2>DEATH MATCH — OVER</h2>
    <h1>BENDAK FALLS</h1>
    <div class="sub">
      The arena goes silent for exactly two seconds.<br>

}
function showLose(){
  document.getElementById('overlay').classList.remove('gone');
  document.getElementById('screen').innerHTML=`
    <h2>DEATH MATCH — OVER</h2>
    <h1 style="color:#ff5e5e">YOU FALL</h1>
    <div class="sub">
      Bendak stands over you. He doesn't gloat — he never does.<br>
      He holsters his blaster and walks out.<br><br>
      Some legends stay legends for a reason.

}
window.startFight = () => {
  startAmbient();
  document.getElementById('overlay').classList.add('gone');
  addLog('<span class="la">"Ladies and gentlebeings — an ILLEGAL DEATH MATCH!"</span>');
  addLog('<span class="ls">No yields. No mercy. No witnesses.</span>');
};
window.resetFight = () => {
  Object.assign(S,{
    php:80,phmax:80,psh:0,pmeds:2,pshields:1,pgcd:0,pdodge:0,
    bhp:120,bhmax:120,bsh:0,bmeds:2,bshields:1,
    countdown:2.2,aiNext:2.0,grenade:false,
    over:false,playerWon:false,slowMo:false,bendakState:'idle',
    bendakLunge:0,bendakFlinch:0,bendakDodge:0,
  });
  for(let i=0;i<6;i++) CDS[i]=0;
  paused=false; queued=null; flashAmt=0; caAmt=0; shakeAmt=0;
  if(bendakObj){ bendakObj.position.set(0,0,2.0); bendakObj.rotation.y=Math.PI; }
  if(bendakMixer){ bendakMixer.stopAllAction(); }
  if(bendakActions['Idle']){ bendakActions['Idle'].play(); bendakCurAction=bendakActions['Idle']; }
  document.getElementById('log').innerHTML='';
  document.getElementById('slowmo').style.opacity='0';
  document.getElementById('overlay').classList.add('gone');
  addLog('<span class="la">"One more time. The crowd demands blood."</span>');
};

// ── Input ────────────────────────────────────────────────────────
addEventListener('keydown', e => {
  if(e.code==='Space'){ e.preventDefault(); togglePause(); return; }
  const map={'1':0,'2':1,'3':2,'4':3,'5':4,'q':5,'Q':5};
  const i=map[e.key]; if(i!==undefined) tryAbility(i);
});
function togglePause(){
  if(S.over||S.countdown>0) return;
  paused=!paused;
  document.getElementById('pbanner').style.display=paused?'flex':'none';
  if(!paused&&queued!==null){ const q=queued; queued=null; tryAbility(q); }
}

// ── Main Loop ────────────────────────────────────────────────────
let last=performance.now();
function frame(now){
  const rawDt=Math.min(.05,(now-last)/1000); last=now;
  const dt=S.slowMo?rawDt*.18:rawDt;
  const t=now/1000;

  if(!paused){
    // Countdown
    if(S.countdown>0){
      S.countdown-=rawDt;
      if(S.countdown<=0) addLog('<span class="la">"FIGHT!"</span>');
    } else if(!S.over){
      // Cooldowns
      for(let i=0;i<6;i++) CDS[i]=Math.max(0,CDS[i]-rawDt);
      S.pgcd=Math.max(0,S.pgcd-rawDt);
      S.pdodge=Math.max(0,S.pdodge-rawDt);
    }
    animBendak(t, rawDt);
    animCamera(t, rawDt);
    animCrowd(t);
    updateBolts(rawDt);
    updateSparks(rawDt);
    if(!S.over) aiTick(rawDt);
    flashAmt=Math.max(0,flashAmt-rawDt*4.5);
  }

  syncHud();
  composer.render();
  requestAnimationFrame(frame);
}

// ── Boot ─────────────────────────────────────────────────────────
buildArena();
buildLights();
buildPlayerWeapon();
scene.add(camera); // weapon is child of camera

loadBendak().then(() => {
  document.getElementById('loading').classList.add('gone');
  showTitle();
  requestAnimationFrame(frame);
}).catch(err => {
  console.error(err);
  document.getElementById('loadtxt').textContent='Load failed. Check network.';
});
