*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;
  font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;}
#c{display:block;width:100vw;height:100vh;cursor:crosshair;touch-action:none;}

/* ── LOADING ─────────────────────────────────────── */
#loading{position:fixed;inset:0;z-index:50;background:#04080f;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5em;}
#loading h2{color:#e8c558;font-size:clamp(18px,3vw,32px);letter-spacing:.25em;font-weight:800;}
#loading p{color:#5ee0ff;font-size:clamp(11px,1.4vw,16px);letter-spacing:.15em;}
#loadbar{width:min(380px,70vw);height:4px;background:#0d1e2e;border-radius:2px;overflow:hidden;}
#loadfill{height:100%;background:linear-gradient(90deg,#e8c558,#ff7040);
  width:0%;transition:width .2s;border-radius:2px;}
#loading.gone{display:none;}

/* ── HUD ─────────────────────────────────────────── */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}

#xhair{position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);width:20px;height:20px;opacity:.75;}
#xhair::before,#xhair::after{content:'';position:absolute;background:#ff8040;border-radius:1px;}
#xhair::before{width:2px;height:100%;left:50%;transform:translateX(-50%);}
#xhair::after{width:100%;height:2px;top:50%;transform:translateY(-50%);}
.xdot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:3px;height:3px;background:#ff8040;border-radius:50%;}

.hpblock{position:absolute;top:3%;width:clamp(180px,28vw,320px);
  padding:.55em .8em;background:rgba(4,9,18,.88);
  border:1px solid rgba(94,224,255,.28);border-radius:8px;backdrop-filter:blur(6px);}
#hbL{left:2%;}#hbR{right:2%;}
.hpname{font-weight:700;font-size:clamp(11px,1.4vw,16px);letter-spacing:.05em;color:#cfe6f5;}
.hptag{font-size:clamp(8px,.85vw,11px);color:#618496;font-style:italic;margin-top:1px;}
.hpbar{height:8px;margin-top:5px;background:#0b1b28;border-radius:4px;overflow:hidden;position:relative;}
.hpfill{height:100%;border-radius:4px;transition:width .18s;}
.hpfill.g{background:linear-gradient(90deg,#2fb857,#7dff8a);}
.hpfill.r{background:linear-gradient(90deg,#c43030,#ff6040);}
.hpfill.s{background:linear-gradient(90deg,#3ab8cc,#5ee0ff);position:absolute;top:0;left:0;height:100%;}
.hpnum{font-size:clamp(8px,.82vw,11px);color:#6a9db0;margin-top:3px;}

#bar{position:absolute;bottom:max(3%,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  display:flex;gap:.4em;pointer-events:all;}
.ab{position:relative;width:clamp(48px,6.8vw,78px);aspect-ratio:1;
  background:rgba(4,9,18,.9);border:1px solid rgba(94,224,255,.3);
  border-radius:9px;cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#cfe6f5;transition:border-color .12s,transform .07s;}
.ab:active{transform:scale(.92);}
.ab:hover{border-color:rgba(232,197,88,.75);}
.ab .ico{font-size:clamp(15px,2.3vw,26px);}
.ab .lbl{font-size:clamp(6px,.65vw,9px);margin-top:2px;letter-spacing:.04em;}
.ab .hk{position:absolute;top:3px;left:5px;font-size:clamp(7px,.7vw,10px);color:#e8c558;font-weight:700;}
.ab .ct{position:absolute;top:3px;right:5px;font-size:clamp(7px,.7vw,10px);color:#5ee0ff;font-weight:700;}
.ab .cdm{position:absolute;bottom:0;left:0;width:100%;background:rgba(2,5,12,.82);pointer-events:none;}
.ab.off{opacity:.3;cursor:default;}

#log{position:absolute;bottom:3%;left:2%;width:28%;max-height:22%;
  overflow:hidden;display:flex;flex-direction:column-reverse;
  font-size:clamp(8px,.95vw,13px);pointer-events:none;}
#log div{padding:2px 0;text-shadow:0 1px 3px #000;animation:lf 7s forwards;}
@keyframes lf{0%{opacity:1}60%{opacity:.9}100%{opacity:0}}
.lh{color:#ffd27d}.lm{color:#7d9bb0}.lc{color:#ff7d7d;font-weight:700}
.ls{color:#5ee0ff}.la{color:#e8c558;font-style:italic}

#flash{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at 50% 40%,rgba(255,50,30,.7) 0%,transparent 70%);}
#slowmo{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at 50% 50%,transparent 30%,rgba(4,9,18,.6) 100%);}
#vign{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 52%,rgba(0,0,0,.65) 100%);}

#pbanner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(2,5,12,.55);pointer-events:none;}
#pbanner span{font-size:clamp(20px,3.5vw,48px);font-weight:800;letter-spacing:.35em;

#announce{position:absolute;top:18%;left:50%;transform:translateX(-50%);

#announce .a1{font-size:clamp(11px,1.5vw,18px);letter-spacing:.4em;color:#5ee0ff;font-weight:700;}
#announce .a2{font-size:clamp(22px,4.5vw,56px);letter-spacing:.14em;color:#e8c558;font-weight:800;
  text-shadow:0 0 40px rgba(232,197,88,.55);margin-top:.15em;}
#announce .a3{font-size:clamp(10px,1.2vw,15px);color:#8ab4cc;font-style:italic;margin-top:.5em;}

#cdown{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);
  font-size:clamp(50px,11vw,150px);font-weight:800;color:#e8c558;
  text-shadow:0 0 60px rgba(232,197,88,.6);pointer-events:none;opacity:0;}

#hitmkr{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  pointer-events:none;opacity:0;font-size:clamp(11px,1.3vw,16px);
  color:#ff8040;font-weight:700;letter-spacing:.1em;text-shadow:0 0 12px #ff6020;}

#shieldRing{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;
  box-shadow:inset 0 0 clamp(40px,8vw,120px) rgba(94,224,255,.5);}

#strafeHint{position:absolute;bottom:26%;left:50%;transform:translateX(-50%);
  color:#3d5f76;font-size:clamp(9px,1vw,13px);letter-spacing:.15em;pointer-events:none;
  opacity:0;transition:opacity .6s;}

/* ── OVERLAY SCREENS ─────────────────────────────── */
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;
  justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:radial-gradient(ellipse at 50% 25%,rgba(14,29,50,.94) 0%,rgba(4,8,16,.97) 80%);}
#overlay.gone{display:none;}
.screen{width:min(94%,800px);text-align:center;padding:2em 1.5em 3em;}
h1{font-size:clamp(28px,5.5vw,68px);letter-spacing:.1em;color:#e8c558;font-weight:800;
  text-shadow:0 0 45px rgba(232,197,88,.4);}
h2{font-size:clamp(11px,1.4vw,17px);color:#5ee0ff;letter-spacing:.32em;margin-bottom:.35em;}
.sub{color:#8ab4cc;font-size:clamp(11px,1.2vw,15px);max-width:560px;
  margin:.8em auto 1.6em;line-height:1.65;}
.btn{display:inline-block;margin:.35em;padding:.65em 2em;
  background:linear-gradient(180deg,#14263a,#0b1726);color:#e8c558;
  border:1px solid rgba(94,224,255,.33);border-radius:8px;
  font-size:clamp(12px,1.3vw,17px);letter-spacing:.1em;cursor:pointer;
  font-weight:700;transition:border-color .14s,transform .07s;pointer-events:all;}
.btn:hover{border-color:#e8c558;}.btn:active{transform:scale(.95);}
kbd{background:#14263a;border:1px solid rgba(94,224,255,.3);border-radius:4px;
  padding:1px 6px;color:#5ee0ff;font-family:inherit;}
.hint{color:#3d5f76;font-size:clamp(9px,.95vw,12px);margin-top:1.6em;line-height:2;}
.stats{display:flex;gap:.6em;justify-content:center;flex-wrap:wrap;margin:.8em 0;}
.stat{background:rgba(8,16,28,.8);border:1px solid rgba(94,224,255,.22);
  border-radius:7px;padding:.35em .8em;color:#9fc6dd;font-size:clamp(10px,1.1vw,14px);}
.stat b{color:#e8c558;}

#rotHint{display:none;position:fixed;inset:0;z-index:99;background:#04080f;
  color:#5ee0ff;font-size:22px;font-weight:700;align-items:center;justify-content:center;
  text-align:center;flex-direction:column;gap:1em;padding:2em;}
@media(max-width:640px)and(orientation:portrait){#rotHint{display:flex;}}
</style>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RGBELoader} from 'three/addons/loaders/RGBELoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {Reflector} from 'three/addons/objects/Reflector.js';

/* ═══════════════════════════════════════════════════════════════
   KOTOR: TARIS DUELING ARENA — BENDAK STARKILLER
   Death Match · First-Person · d20 Under the Hood
   Character art: Quaternius (CC0) · Engine: three.js (vendored)
   ═══════════════════════════════════════════════════════════════ */

// ── Utilities ──────────────────────────────────────────────────
const TAU = Math.PI * 2;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp  = (a,b,k) => a + (b - a) * k;
const rnd   = (a,b) => a + Math.random() * (b - a);
const irnd  = (a,b) => Math.floor(rnd(a, b + 1));
const d     = s => irnd(1, s);
const d20   = () => d(20);
const isTouch = matchMedia('(pointer:coarse)').matches;
const LITE = new URLSearchParams(location.search).has('lite');

// ── Audio Engine ───────────────────────────────────────────────
let audioCtx = null;
function getAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function makeNoiseBuf(ctx, duration){
  const n = ctx.sampleRate * duration | 0;
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d2 = buf.getChannelData(0);
  for(let i = 0; i < n; i++) d2[i] = Math.random() * 2 - 1;
  return buf;
}
function playBlaster(isPlayer = true){
  const ctx = getAudio(); const t = ctx.currentTime;
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 3500;
  f.connect(ctx.destination);
  const osc = ctx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(isPlayer ? 680 : 480, t);
  osc.frequency.exponentialRampToValueAtTime(isPlayer ? 90 : 65, t + .18);
  const og = ctx.createGain();
  og.gain.setValueAtTime(.28, t);
  og.gain.exponentialRampToValueAtTime(.001, t + .22);
  osc.connect(og); og.connect(f);
  const ns = ctx.createBufferSource(); ns.buffer = makeNoiseBuf(ctx, .06);
  const ng = ctx.createGain();
  ng.gain.setValueAtTime(.18, t); ng.gain.exponentialRampToValueAtTime(.001, t + .06);
  ns.connect(ng); ng.connect(f);
  osc.start(t); osc.stop(t + .25); ns.start(t);
}
function playImpact(big = false){
  const ctx = getAudio(); const t = ctx.currentTime;
  const ns = ctx.createBufferSource(); ns.buffer = makeNoiseBuf(ctx, .15);
  const f = ctx.createBiquadFilter(); f.type = 'bandpass';
  f.frequency.value = big ? 600 : 1400; f.Q.value = big ? 1.5 : 3;
  const g = ctx.createGain();
  g.gain.setValueAtTime(big ? .55 : .32, t);
  g.gain.exponentialRampToValueAtTime(.001, t + (big ? .25 : .12));
  ns.connect(f); f.connect(g); g.connect(ctx.destination);
  ns.start(t);
  if(big){
    const osc = ctx.createOscillator(); osc.type = 'sine';
    osc.frequency.setValueAtTime(80, t);
    osc.frequency.exponentialRampToValueAtTime(30, t + .25);
    const og = ctx.createGain(); og.gain.setValueAtTime(.35, t);
    og.gain.exponentialRampToValueAtTime(.001, t + .3);
    osc.connect(og); og.connect(ctx.destination);
    osc.start(t); osc.stop(t + .3);
  }
}
function playShieldImpact(){
  const ctx = getAudio(); const t = ctx.currentTime;
  for(let i = 0; i < 3; i++){
    const osc = ctx.createOscillator(); osc.type = 'sine';
    osc.frequency.setValueAtTime(1200 + i * 340, t + i*.025);
    const g = ctx.createGain();
    g.gain.setValueAtTime(.12, t + i*.025);
    g.gain.exponentialRampToValueAtTime(.001, t + i*.025 + .18);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t + i*.025); osc.stop(t + i*.025 + .22);
  }
}
function playHeal(){
  const ctx = getAudio(); const t = ctx.currentTime;
  [523,659,784,1047].forEach((f,i) => {
    const osc = ctx.createOscillator(); osc.type = 'sine';
    osc.frequency.value = f;
    const g = ctx.createGain();
    g.gain.setValueAtTime(.15, t + i*.08);
    g.gain.exponentialRampToValueAtTime(.001, t + i*.08 + .2);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t + i*.08); osc.stop(t + i*.08 + .25);
  });
}
function playFanfare(){
  const ctx = getAudio(); const t = ctx.currentTime;
  [[392,0],[523,0.12],[659,0.24],[784,0.36],[1047,0.52],[784,0.72],[1047,0.84]].forEach(([f,dt]) => {
    const osc = ctx.createOscillator(); osc.type = 'triangle';
    osc.frequency.value = f;
    const g = ctx.createGain();
    g.gain.setValueAtTime(.16, t + dt);
    g.gain.exponentialRampToValueAtTime(.001, t + dt + .4);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t + dt); osc.stop(t + dt + .45);
  });
}
function playBeep(final = false){
  const ctx = getAudio(); const t = ctx.currentTime;
  const osc = ctx.createOscillator(); osc.type = 'square';
  osc.frequency.value = final ? 880 : 440;
  const g = ctx.createGain();
  g.gain.setValueAtTime(.1, t);
  g.gain.exponentialRampToValueAtTime(.001, t + (final ? .5 : .15));
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t); osc.stop(t + (final ? .5 : .16));
}
function playExplosion(){
  const ctx = getAudio(); const t = ctx.currentTime;
  const ns = ctx.createBufferSource(); ns.buffer = makeNoiseBuf(ctx, .6);
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 400;
  const g = ctx.createGain();
  g.gain.setValueAtTime(.9, t); g.gain.exponentialRampToValueAtTime(.001, t + .6);
  ns.connect(f); f.connect(g); g.connect(ctx.destination); ns.start(t);
  const osc = ctx.createOscillator(); osc.type = 'sine';
  osc.frequency.setValueAtTime(120, t);
  osc.frequency.exponentialRampToValueAtTime(25, t + .5);
  const og = ctx.createGain(); og.gain.setValueAtTime(.6, t);
  og.gain.exponentialRampToValueAtTime(.001, t + .5);
  osc.connect(og); og.connect(ctx.destination); osc.start(t); osc.stop(t + .5);
}

// Continuous crowd murmur, swells on demand
let crowdGain = null;
function startCrowdLoop(){
  if(crowdGain) return;
  const ctx = getAudio();
  const src = ctx.createBufferSource();
  src.buffer = makeNoiseBuf(ctx, 3); src.loop = true;
  const f = ctx.createBiquadFilter(); f.type = 'bandpass';
  f.frequency.value = 700; f.Q.value = .35;
  crowdGain = ctx.createGain(); crowdGain.gain.value = .05;
  src.connect(f); f.connect(crowdGain); crowdGain.connect(ctx.destination);
  src.start();
}
function crowdRoar(amt = .3, dur = 1.4){
  if(!crowdGain) return;
  const t = getAudio().currentTime;
  crowdGain.gain.cancelScheduledValues(t);
  crowdGain.gain.setValueAtTime(crowdGain.gain.value, t);
  crowdGain.gain.linearRampToValueAtTime(amt, t + .18);
  crowdGain.gain.exponentialRampToValueAtTime(.05, t + dur);
}

// Ambient tension drone
let ambientStarted = false;
function startAmbient(){
  if(ambientStarted) return; ambientStarted = true;
  const ctx = getAudio();
  const masterGain = ctx.createGain(); masterGain.gain.value = .1;
  masterGain.connect(ctx.destination);
  [[55,.06],[55.5,.04],[110,.03],[82.4,.025]].forEach(([freq, vol]) => {
    const osc = ctx.createOscillator(); osc.type = 'sine';
    osc.frequency.value = freq;
    const g = ctx.createGain(); g.gain.value = vol;
    osc.connect(g); g.connect(masterGain); osc.start();
  });
  const pulse = () => {
    if(!audioCtx || audioCtx.state !== 'running') return;
    const t = ctx.currentTime;
    const osc = ctx.createOscillator(); osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, t);
    osc.frequency.exponentialRampToValueAtTime(110, t + 1.2);
    const g = ctx.createGain(); g.gain.setValueAtTime(.0, t);
    g.gain.linearRampToValueAtTime(.04, t + .1);
    g.gain.exponentialRampToValueAtTime(.001, t + 1.2);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 600;
    osc.connect(f); f.connect(g); g.connect(masterGain);
    osc.start(t); osc.stop(t + 1.3);
    setTimeout(pulse, 3200 + Math.random() * 1800);
  };
  setTimeout(pulse, 1000);

      float d=length(vUv-c)*2.;
      float v=smoothstep(1.,.25,d*vig);
      gl_FragColor=vec4(r,g,b,1.)*v;

    [-11,-31,3,20,3],[-5,-33,2.5,13,2.5],[5,-33,2.5,15,2.5],
    [11,-31,3,22,3],[18,-34,4.5,28,4.5],[24,-30,3.5,16,3.5],[30,-32,5.5,27,5.5],
    [-38,-22,6,20,7],[38,-22,6,22,7],[-44,-12,5.5,16,5],
    [44,-12,5.5,18,5],[-50,-5,5,12,6],[50,-5,5,14,6],
    [-30,32,5.5,24,5.5],[-18,34,4.5,30,4.5],[-6,33,3,17,3],
    [6,33,3,19,3],[18,34,4.5,26,4.5],[30,32,5.5,22,5.5],
  ];
  for(const [x,z,w,h,dep] of buildings){

// Build one character instance from the soldier rig.
// opts: {weapon:'Shotgun'|null, tint:{Character_Main,Pants,...}, shadows:bool}
function makeCharacter(opts = {}){
  const obj = SkeletonUtils.clone(soldierGltf.scene);
  obj.traverse(c => {
    if(c.isMesh || c.isSkinnedMesh){
      c.castShadow = !!opts.shadows; c.receiveShadow = false;
      c.frustumCulled = false;
    }
  });
  // weapons: hide all but chosen
  for(const w of WEAPON_NAMES){
    const n = obj.getObjectByName(w);
    if(n) n.visible = (w === opts.weapon);
  }
  // per-instance material recolor
  if(opts.tint){
    const cache = {};
    obj.traverse(c => {
      if(!(c.isMesh || c.isSkinnedMesh)) return;
      const mats = Array.isArray(c.material) ? c.material : [c.material];
      const out = mats.map(m => {
        const spec = opts.tint[m.name];
        if(!spec) return m;
        if(!cache[m.name]){
          const nm = m.clone();
          if(spec.color !== undefined) nm.color.set(spec.color);
          if(spec.metalness !== undefined) nm.metalness = spec.metalness;
          if(spec.roughness !== undefined) nm.roughness = spec.roughness;
          if(spec.emissive !== undefined){ nm.emissive.set(spec.emissive); nm.emissiveIntensity = spec.emissiveIntensity ?? 1; }
          cache[m.name] = nm;
        }
        return cache[m.name];
      });
      c.material = Array.isArray(c.material) ? out : out[0];
    });
  }
  const mixer = new THREE.AnimationMixer(obj);
  const actions = {};
  for(const clip of soldierGltf.animations){
    const a = mixer.clipAction(clip);
    if(['Death','HitReact','Idle_Shoot','Punch','Jump_Land','Duck'].includes(clip.name)){
      a.loop = THREE.LoopOnce; a.clampWhenFinished = true;
    }
    actions[clip.name] = a;
  }
  return {obj, mixer, actions, cur:null};
}
function playAnim(ch, name, fade = .18, opts = {}){
  const a = ch.actions[name];
  if(!a || ch.cur === a) return;
  a.reset();
  if(opts.timeScale) a.timeScale = opts.timeScale;
  a.play();
  if(ch.cur) ch.cur.crossFadeTo(a, fade, false);
  ch.cur = a;
}
// One-shot overlay: play a LoopOnce anim then return to base
function playOneShot(ch, name, backTo, fade = .1){
  const a = ch.actions[name];
  if(!a) return;
  playAnim(ch, name, fade);
  const onDone = e => {
    if(e.action !== a) return;
    ch.mixer.removeEventListener('finished', onDone);
    if(!S.over || (ch === bendak && S.playerWon === false))
      playAnim(ch, backTo, .22);
  };
  ch.mixer.addEventListener('finished', onDone);
}

const crowd = [];
const CROWD_ANIMS = ['Idle','Idle','Idle','Wave','Yes','No','Punch'];
function buildCrowdActors(){
  const N = LITE ? 8 : (isTouch ? 14 : 20);
  for(let i = 0; i < N; i++){
    const a = (i / N) * TAU + rnd(-.1, .1);
    const tier = i % 2;
    const r2 = tier === 0 ? rnd(12.9, 13.9) : rnd(15.0, 16.0);
    const hue = Math.random();
    const ch = makeCharacter({
      weapon: null, shadows: false,
      tint: {
        Character_Main: {color: new THREE.Color().setHSL(hue, .45, .3).getHex(), metalness:.2, roughness:.75},
        Pants:          {color: new THREE.Color().setHSL((hue+.4)%1, .3, .2).getHex(), roughness:.8},
        Skin:           {color: new THREE.Color().setHSL(rnd(.05,.1), rnd(.25,.5), rnd(.28,.55)).getHex(), roughness:.9, metalness:0},
      }
    });
    ch.obj.position.set(Math.sin(a)*r2, tier === 0 ? .9 : 2.5, Math.cos(a)*r2);
    ch.obj.scale.setScalar(rnd(.82, .95));
    ch.obj.lookAt(0, ch.obj.position.y, 0);
    scene.add(ch.obj);
    const start = CROWD_ANIMS[irnd(0, CROWD_ANIMS.length-1)];
    playAnim(ch, start);
    if(ch.cur){ ch.cur.time = rnd(0, 1); ch.cur.timeScale = rnd(.85, 1.2); }
    ch.nextSwap = rnd(2, 7);
    crowd.push(ch);
  }
}
function crowdCheer(big = false){
  crowdRoar(big ? .5 : .28, big ? 2.6 : 1.3);
  const n = big ? crowd.length : Math.ceil(crowd.length * .4);
  for(let i = 0; i < n; i++){
    const ch = crowd[irnd(0, crowd.length-1)];
    playAnim(ch, Math.random() < .5 ? 'Wave' : 'Punch', .15);
    if(ch.cur) ch.cur.timeScale = rnd(1, 1.5);
    ch.nextSwap = rnd(1.5, 4);
  }
}
function updateCrowd(dt){
  for(const ch of crowd){
    ch.mixer.update(dt);
    ch.nextSwap -= dt;
    if(ch.nextSwap <= 0){
      ch.nextSwap = rnd(3, 9);
      playAnim(ch, CROWD_ANIMS[irnd(0, CROWD_ANIMS.length-1)], .3);
      if(ch.cur) ch.cur.timeScale = rnd(.85, 1.2);
    }
  }
}

// ── Bolt FX ─────────────────────────────────────────────────────
const activeBolts = [];
function makeBolt(){
  const g = new THREE.Group();
  const core = new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,.6,6), M.boltC);
  core.rotation.x = Math.PI/2; core.castShadow = false; g.add(core);
  const glow = new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,.52,6), M.bolt);
  glow.rotation.x = Math.PI/2; glow.castShadow = false; g.add(glow);
  const pl = new THREE.PointLight(0xff6600, 5, 3); g.add(pl);
  g.visible = false; scene.add(g); return g;
}
const boltPool = Array.from({length:14}, makeBolt);
function fireBolt(from, to, onLand, blue = false){
  const b = boltPool.find(x => !x.visible) || boltPool[0];
  b.visible = true;
  b.children[1].material = blue ? M.boltB : M.bolt;
  b.children[2].color.set(blue ? 0x3399ff : 0xff6600);
  const start = from.clone(); const end = to.clone();
  b.position.copy(start); b.lookAt(end);
  const dur = Math.max(.06, start.distanceTo(end) * .04);
  b.userData = {start, end, dur, t:0, onLand};
  activeBolts.push(b);
}
function updateBolts(dt){
  for(let i = activeBolts.length-1; i >= 0; i--){
    const b = activeBolts[i]; b.userData.t += dt;
    const k = clamp(b.userData.t / b.userData.dur, 0, 1);
    b.position.lerpVectors(b.userData.start, b.userData.end, k);
    if(k >= 1){
      b.visible = false; activeBolts.splice(i,1);
      b.userData.onLand?.();
    }
  }
}

// ── Spark Particles ─────────────────────────────────────────────
const sparks = [];
const sparkGeo = new THREE.SphereGeometry(.022, 4, 4);
function spawnSparks(pos, n=20, col=0xff8840){
  for(let i=0;i<n;i++){
    const s = new THREE.Mesh(sparkGeo, new THREE.MeshBasicMaterial({color:col}));
    s.castShadow = false;
    s.position.copy(pos);
    s.userData = {v: new THREE.Vector3(rnd(-5,5),rnd(.5,7),rnd(-5,5)), life:rnd(.25,.55), t:0};
    scene.add(s); sparks.push(s);
  }
  const fl = new THREE.PointLight(col, 10, 4);
  fl.position.copy(pos); scene.add(fl);
  fl.userData = {life:.12, t:0, isLight:true};
  sparks.push(fl);
}
function updateSparks(dt){
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i]; s.userData.t+=dt;
    if(s.userData.t>s.userData.life){
      scene.remove(s); if(!s.userData.isLight) s.material.dispose();
      sparks.splice(i,1); continue;
    }
    const k = 1-s.userData.t/s.userData.life;
    if(s.userData.isLight){ s.intensity=10*k; }
    else { s.userData.v.y-=15*dt; s.position.addScaledVector(s.userData.v,dt); s.scale.setScalar(k*.8+.2); }
  }
}

// ── Floating Damage Numbers ─────────────────────────────────────
const floaters = [];
function spawnDamageNumber(pos, text, crit = false, color = '#ffd27d'){
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 128;
  const c = cv.getContext('2d');
  c.font = `800 ${crit ? 74 : 54}px -apple-system, system-ui, sans-serif`;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.shadowColor = crit ? '#ff3000' : '#000'; c.shadowBlur = crit ? 24 : 8;
  c.fillStyle = crit ? '#ff5030' : color;
  c.fillText(text, 128, 64);
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
  sp.scale.set(crit ? 1.3 : .9, crit ? .65 : .45, 1);
  sp.position.copy(pos).add(new THREE.Vector3(rnd(-.3,.3), rnd(0,.2), rnd(-.1,.1)));
  scene.add(sp);
  floaters.push({sp, t:0, life:1.05, vy: crit ? 1.6 : 1.25});
}
function updateFloaters(dt){
  for(let i=floaters.length-1;i>=0;i--){
    const f = floaters[i]; f.t += dt;
    if(f.t > f.life){
      scene.remove(f.sp); f.sp.material.map.dispose(); f.sp.material.dispose();
      floaters.splice(i,1); continue;
    }
    f.sp.position.y += f.vy * dt;
    f.sp.material.opacity = 1 - (f.t/f.life)**2;
  }
}

// ── Game State (d20 engine) ─────────────────────────────────────
const S = {
  php:100, phmax:100, patk:8, pdef:15, pdodge:0,
  psh:0,  pshmax:30, pmeds:2, pshields:1, pgcd:0,
  bhp:190, bhmax:190, batk:7, bdef:17,
  bsh:0,  bshmax:30, bmeds:2, bshields:1, bdodge:0,
  phase:'load',          // load|title|intro|countdown|fight|end
  countdown:0, aiNext:2.0, grenade:false, enraged:false,
  over:false, playerWon:false, slowMo:false,
  stats:{shots:0, hits:0, crits:0, dealt:0, taken:0, biggest:0, t0:0, dur:0},
};
window.__S = S; // debug/test hook
const CDS=[0,0,0,0,0,0];
const ABCD=[0,6,8,1,5,5];
const ABGCD=[1.4,1.4,1.6,.6,.8,.3];
let paused=false, queued=null;
let flashAmt=0, caAmt=0, shakeAmt=0;

// player polar position on the ring
let playerAngle = 0;                 // 0 = south entrance (z+)
const PLAYER_R = 7.0;
const playerPos = new THREE.Vector3();
function syncPlayerPos(){
  playerPos.set(Math.sin(playerAngle)*PLAYER_R, 0, Math.cos(playerAngle)*PLAYER_R);
}
syncPlayerPos();

function roll(atk, def, mod){
  const r=d20(); const tot=r+atk+mod;
  const hit=r===20||(r!==1&&tot>=def); const crit=r>=19;
  return{r,tot,hit,crit};
}
function dmg(n,s,b,mul){ let v=0;for(let i=0;i<n;i++) v+=d(s); return (v+b)*mul|0; }

function bendakChest(){ return bendakPos.clone().add(new THREE.Vector3(0,1.45,0)); }
function playerChest(){ return playerPos.clone().add(new THREE.Vector3(0,1.5,0)); }
function bendakMuzzle(){
  // roughly at his weapon hand
  const v = bendakChest();
  const toP = playerPos.clone().sub(bendakPos).normalize();
  return v.addScaledVector(toP, .55);
}

function playerFire(mod, mul, label, extra){
  weaponRecoil = 1;
  muzzleFlashLight.intensity = 60;
  muzzleSprite.material.opacity = 1;
  muzzleSprite.material.rotation = rnd(0, TAU);
  setTimeout(()=>{ muzzleFlashLight.intensity=0; muzzleSprite.material.opacity=0; }, 70);
  playBlaster(true);
  S.stats.shots++;
  const from = new THREE.Vector3();
  camera.getWorldPosition(from);
  const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);
  from.addScaledVector(fwd, .6); from.y -= .12;
  const aim = bendakChest().add(new THREE.Vector3(rnd(-.15,.15), rnd(-.2,.25), rnd(-.15,.15)));
  fireBolt(from, aim, () => {
    if(S.over) return;
    const eff = S.bdef + (S.bdodge > 0 ? 6 : 0);
    const r = roll(S.patk, eff, mod);
    if(r.hit){
      let raw = dmg(2,6,5,mul);
      if(r.crit) raw *= 2;
      let absorbed = 0;
      if(S.bsh > 0){ absorbed = Math.min(S.bsh, raw); S.bsh -= absorbed; raw -= absorbed; playShieldImpact(); }
      S.bhp = clamp(S.bhp-raw, 0, S.bhmax);
      S.stats.hits++; S.stats.dealt += raw;
      if(r.crit) S.stats.crits++;
      if(raw > S.stats.biggest) S.stats.biggest = raw;
      spawnSparks(aim, raw>10?26:14, absorbed>0?0x5ee0ff:0xff8840);
      spawnDamageNumber(bendakChest().add(new THREE.Vector3(0,.7,0)),
        absorbed>0 && raw===0 ? 'ABSORB' : String(raw), r.crit);
      showHitMarker();
      shakeAmt = Math.max(shakeAmt, .025);
      if(!S.over && S.bhp>0 && raw>0 && Math.random()<.6) playOneShot(bendak, 'HitReact', bendakMove, .06);
      addLog(`<span class="${r.crit?'lc':'lh'}">${label}: ${r.r}+${S.patk+mod}=${r.tot} vs DEF ${eff}${r.crit?' — CRITICAL!':''} — ${raw} dmg</span>`);
      if(!absorbed) playImpact(r.crit);
      if(r.crit) crowdCheer(false);
      if(extra) setTimeout(()=>{ if(!S.over) playerFire(mod,mul,label); }, 280);
    } else {
      spawnDamageNumber(bendakChest().add(new THREE.Vector3(0,.7,0)), 'MISS', false, '#7d9bb0');
      addLog(`<span class="lm">${label}: ${r.tot} vs DEF ${eff} — miss</span>`);
      if(extra) setTimeout(()=>{ if(!S.over) playerFire(mod,mul,label); }, 280);
    }
    checkEnd();
  });
}

const ABILITIES = [
  {can:()=>true, exec(){playerFire(0,1,'Blaster Shot');}},
  {can:()=>true, exec(){playerFire(-2,2,'Power Blast');}},
  {can:()=>true, exec(){playerFire(-4,1,'Rapid Shot',true);}},
  {can:()=>S.pshields>0&&S.psh<=0, exec(){
    S.pshields--; S.psh=S.pshmax; playShieldImpact();
    document.getElementById('shieldRing').style.opacity='1';
    addLog('<span class="ls">Energy shield active — absorbs 30 damage.</span>');
  }},
  {can:()=>S.pmeds>0&&S.php<S.phmax, exec(){
    S.pmeds--; const h=20+d(10); S.php=clamp(S.php+h,0,S.phmax);
    playHeal();
    addLog(`<span class="ls">Medpac: +${h} vitality.</span>`);
  }},
  {can:()=>true, exec(){
    S.pdodge=1.6;
    addLog('<span class="ls">Dodge — +6 DEF for 1.6s.</span>');
  }},
];
window.tryAbility = i => {
  if(S.over||S.phase!=='fight') return;
  startAmbient();
  const a=ABILITIES[i];
  if(CDS[i]>0||S.pgcd>0||!a.can()) return;
  if(paused){ queued=i; addLog('<span class="ls">Queued — unpause to execute.</span>'); return; }
  CDS[i]=ABCD[i]; S.pgcd=ABGCD[i]; a.exec();
};

// ── Bendak AI ───────────────────────────────────────────────────
let bendakStrafe = {dir: 1, until: 2.5};
function aiTick(dt){
  S.aiNext -= dt;
  if(S.aiNext > 0||S.over||S.phase!=='fight') return;
  const pace = S.enraged ? 1.35 : 2.0;
  S.aiNext = pace * rnd(.85,1.2);

  if(S.bhp < S.bhmax*.28 && S.bmeds>0){
    S.bmeds--; const h=20+d(10); S.bhp=clamp(S.bhp+h,0,S.bhmax);
    playOneShot(bendak, 'Duck', bendakMove, .15);
    spawnDamageNumber(bendakChest().add(new THREE.Vector3(0,.8,0)), '+'+h, false, '#7dff8a');
    addLog(`<span class="ls">Bendak slams a medpac: +${h}.</span>`); return;
  }
  if(S.bhp < S.bhmax*.52 && S.bshields>0 && S.bsh<=0){
    S.bshields--; S.bsh=S.bshmax; playShieldImpact();
    addLog('<span class="ls">Bendak\'s shield blazes to life!</span>'); return;
  }
  if(!S.grenade && S.bhp < S.bhmax*.48){
    S.grenade=true;
    throwGrenade(); return;
  }
  if(!S.enraged && S.bhp < S.bhmax*.33){
    S.enraged = true;
    announce('', 'BENDAK IS ENRAGED', '"No one survives me twice."', 2200);
    holoText = 'BENDAK ENRAGED · THE CHAMPION SMELLS BLOOD · ';
    if(bendak.headLight) bendak.headLight.intensity = 5;
    crowdCheer(true);
    addLog('<span class="lc">Bendak roars — his attacks quicken!</span>');
    return;
  }
  const p=Math.random();
  let mod=0,mul=1,label='Blaster Shot';
  if(p<.28){mod=-2;mul=2;label='Power Blast';}
  else if(p<.44){mod=-4;label='Rapid Shot';}
  bendakFire(mod,mul,label);
  if(mod===-4) setTimeout(()=>{if(!S.over) bendakFire(-4,1,'Rapid Shot');},280);
}

function bendakFire(mod,mul,label){
  if(!bendak||S.over) return;
  playOneShot(bendak, 'Idle_Shoot', bendakMove, .07);
  playBlaster(false);
  const to = playerChest().add(new THREE.Vector3(rnd(-.15,.15), rnd(-.18,.18), rnd(-.15,.15)));
  fireBolt(bendakMuzzle(), to, ()=>{
    if(S.over) return;
    const def=S.pdef+(S.pdodge>0?6:0);
    const r=roll(S.batk,def,mod);
    if(r.hit){
      let raw=dmg(2,6,3,mul);
      if(r.crit) raw*=2;
      if(S.psh>0){
        const abs=Math.min(S.psh,raw);S.psh-=abs;raw-=abs;playShieldImpact();
        if(S.psh<=0) document.getElementById('shieldRing').style.opacity='0';
      }
      S.php=clamp(S.php-raw,0,S.phmax);
      S.stats.taken += raw;
      flashAmt=clamp(raw/35,.15,1); caAmt=clamp(raw/120,.006,.04);
      shakeAmt=Math.max(shakeAmt,.04+raw*.003);
      spawnSparks(playerChest().add(new THREE.Vector3(rnd(-.2,.2),0,rnd(-.2,.2))),12,0x5ee0ff);
      addLog(`<span class="${r.crit?'lc':'lh'}">Bendak — ${label}: ${r.tot} vs DEF ${def}${r.crit?' — CRITICAL!':''} — ${raw} dmg</span>`);
      if(!S.over) playImpact(r.crit);
      if(r.crit) crowdCheer(false);
    } else {
      addLog(`<span class="lm">Bendak — ${label}: ${r.tot} vs DEF ${def} — miss</span>`);
    }
    checkEnd();
  }, true);
}

function throwGrenade(){
  playOneShot(bendak, 'Punch', bendakMove, .12);
  addLog('<span class="la">Bendak pulls something from his belt...</span>');
  setTimeout(() => {
    if(S.over) return;
    // visible projectile
    const g = new THREE.Mesh(new THREE.SphereGeometry(.09, 8, 8),
      new THREE.MeshStandardMaterial({color:0x333333, emissive:new THREE.Color(0xff2200), emissiveIntensity:2}));
    const gl = new THREE.PointLight(0xff3300, 3, 2); g.add(gl);
    scene.add(g);
    const from = bendakChest(), to = playerPos.clone().add(new THREE.Vector3(rnd(-.5,.5), .2, rnd(-.5,.5)));
    const T = .8; let t = 0;
    const step = () => {
      t += 1/60;
      const k = clamp(t/T, 0, 1);
      g.position.lerpVectors(from, to, k);
      g.position.y += Math.sin(k * Math.PI) * 2.2;
      if(k < 1 && !S.over){ requestAnimationFrame(step); return; }
      scene.remove(g);
      if(S.over) return;
      playExplosion();
      let raw=d(6)+d(6)+d(6)+3;
      if(S.psh>0){const abs=Math.min(S.psh,raw);S.psh-=abs;raw-=abs;
        if(S.psh<=0) document.getElementById('shieldRing').style.opacity='0';}
      S.php=clamp(S.php-raw,0,S.phmax);
      S.stats.taken += raw;
      flashAmt=1; caAmt=.035; shakeAmt=.22;
      spawnSparks(to.clone().add(new THREE.Vector3(0,1,0)),40,0xff4400);
      crowdCheer(false);
      addLog(`<span class="lc">FRAG GRENADE — ${raw} damage!</span>`);
      checkEnd();
    };
    step();
  }, 500);
}

function checkEnd(){
  if(S.over) return;
  if(S.bhp<=0){
    S.over=true; S.playerWon=true; S.phase='end';
    S.stats.dur = (performance.now() - S.stats.t0) / 1000;
    startDeathSequence();
  }
  else if(S.php<=0){
    S.over=true; S.phase='end';
    S.stats.dur = (performance.now() - S.stats.t0) / 1000;
    playAnim(bendak, 'Idle', .3);
    flashAmt = 1;
    setTimeout(showLose,2400);
  }
}

// ── Intro Cinematic ─────────────────────────────────────────────
const INTRO_LINES = [
  ['TARIS UPPER CITY', 'THE DUEL RING', '"Gentlebeings... tonight, we break the rules."', 2.8],
  ['THE CHALLENGER', 'THE MYSTERIOUS STRANGER', '"Nobody knows this one\'s name. After tonight, everybody will — or nobody will."', 3.2],
  ['THE LEGEND RETURNS', 'BENDAK ★ STARKILLER', '"Twenty years. Zero defeats. One rule tonight: TO. THE. DEATH."', 3.6],
];
let intro = null;
function startIntro(){
  S.phase = 'intro';
  document.getElementById('overlay').classList.add('gone');
  startAmbient(); startCrowdLoop(); crowdRoar(.35, 2.5);
  intro = {t: 0, line: -1, total: INTRO_LINES.reduce((s,l)=>s+l[3], 0) + .6};
  playAnim(bendak, 'Idle');
}
function updateIntro(dt, t){
  intro.t += dt;
  // which line
  let acc = 0, li = INTRO_LINES.length - 1;
  for(let i = 0; i < INTRO_LINES.length; i++){
    if(intro.t < acc + INTRO_LINES[i][3]){ li = i; break; }
    acc += INTRO_LINES[i][3];
  }
  if(li !== intro.line){
    intro.line = li;
    const L = INTRO_LINES[li];
    announce(L[0], L[1], L[2], L[3]*1000 - 300);
    if(li === 2){ crowdRoar(.5, 3); playOneShot(bendak, 'Wave', 'Idle', .2); }
  }
  // camera: slow orbit around Bendak, low heroic angle
  const k = intro.t / intro.total;
  const a = k * Math.PI * 1.15 + Math.PI * .2;
  const r = lerp(5.5, 3.6, k);
  camera.position.set(
    bendakPos.x + Math.sin(a) * r,
    lerp(.9, 1.8, k*k),
    bendakPos.z + Math.cos(a) * r);
  camera.lookAt(bendakPos.x, 1.35, bendakPos.z);
  if(intro.t >= intro.total) startCountdown();
}
window.skipIntro = () => { if(S.phase === 'intro') startCountdown(); };

// ── Countdown ───────────────────────────────────────────────────
let cdState = null;
function startCountdown(){
  S.phase = 'countdown';
  document.getElementById('announce').style.opacity = '0';
  cdState = {t: 0, last: 4};
  playAnim(bendak, 'Idle');
}
function updateCountdown(dt){
  cdState.t += dt;
  // camera: fly to player eye
  const k = clamp(cdState.t / 1.1, 0, 1);
  const e = k<1 ? 1-Math.pow(1-k,3) : 1;
  const eye = playerPos.clone().add(new THREE.Vector3(0, 1.65, 0));
  if(k < 1 && cdState.from === undefined){
    cdState.from = camera.position.clone();
  }
  if(cdState.from) camera.position.lerpVectors(cdState.from, eye, e);
  else camera.position.copy(eye);
  camera.lookAt(bendakChest());
  const remain = 4.4 - cdState.t;
  const n = Math.ceil(remain - 1);
  const el = document.getElementById('cdown');
  if(n <= 3 && n >= 1 && n !== cdState.last){
    cdState.last = n; el.textContent = n; el.style.opacity = '1';
    playBeep(false);
    setTimeout(()=> el.style.opacity='0', 650);
  }
  if(remain <= 1 && cdState.last !== 0){
    cdState.last = 0; el.textContent = 'FIGHT'; el.style.opacity = '1';
    playBeep(true); crowdRoar(.4, 2);
    setTimeout(()=> el.style.opacity='0', 800);
  }
  if(remain <= 0) startFightPhase();
}
window.__go = () => startFightPhase();  // test hook
function startFightPhase(){
  S.phase = 'fight';
  S.stats.t0 = performance.now();
  document.getElementById('strafeHint').style.opacity = '1';
  setTimeout(()=> document.getElementById('strafeHint').style.opacity = '0', 4200);
  addLog('<span class="la">The suppression field drops. It\'s live.</span>');
}

// ── Bendak Movement ─────────────────────────────────────────────
function updateBendak(dt, t){
  if(!bendak) return;
  const mixDt = S.slowMo ? dt*.18 : dt;

  if(S.phase === 'fight' && !S.over){
    // desired: keep 4.2–6.5m from player, strafe around
    bendakStrafe.until -= dt;
    if(bendakStrafe.until <= 0){
      bendakStrafe.dir = Math.random() < .5 ? -1 : 1;
      bendakStrafe.until = rnd(1.6, 3.4);
    }
    const toPlayer = playerPos.clone().sub(bendakPos); toPlayer.y = 0;
    const dist = toPlayer.length(); toPlayer.normalize();
    const side = new THREE.Vector3(-toPlayer.z, 0, toPlayer.x);
    const speed = S.enraged ? 2.2 : 1.35;
    const vel = new THREE.Vector3();
    const targetDist = S.enraged ? 4.4 : 5.4;
    if(dist > targetDist + .6) vel.addScaledVector(toPlayer, speed);
    else if(dist < targetDist - .8) vel.addScaledVector(toPlayer, -speed*.7);
    vel.addScaledVector(side, bendakStrafe.dir * speed * .75);
    bendakPos.addScaledVector(vel, dt);
    // clamp inside ring
    const rr = Math.hypot(bendakPos.x, bendakPos.z);
    if(rr > ARENA_R - 1.2) bendakPos.multiplyScalar((ARENA_R - 1.2)/rr);
    bendak.obj.position.copy(bendakPos);

    // pick base move anim
    const spd = vel.length();
    const want = spd > 1.8 ? 'Run_Shoot' : spd > .3 ? 'Walk_Shoot' : 'Idle';
    if(want !== bendakMove){
      bendakMove = want;
      // don't stomp a one-shot in progress
      const oneShots = ['Idle_Shoot','HitReact','Punch','Duck','Death'];
      const curName = Object.keys(bendak.actions).find(k => bendak.actions[k] === bendak.cur);
      if(!oneShots.includes(curName)) playAnim(bendak, want, .25);
    }
  }
  // face player (except in death)
  if(!(S.over && S.playerWon)){
    const look = playerPos.clone(); look.y = bendak.obj.position.y;
    bendak.obj.lookAt(look);
  }
  if(bendak.headLight) bendak.headLight.intensity = (S.enraged?5:2.2) + Math.sin(t*4)*.6;
  bendak.mixer.update(mixDt);

  // shield bubble
  if(bendakBubble){
    bendakBubble.visible = S.bsh > 0;
    if(bendakBubble.visible){
      bendakBubble.position.copy(bendakPos).add(new THREE.Vector3(0,1.2,0));
      const pul = 1 + Math.sin(t*6)*.03;
      bendakBubble.scale.setScalar(pul);
      bendakBubble.material.opacity = .1 + Math.sin(t*8)*.04;
    }
  }
}

// ── Player Movement / Camera ────────────────────────────────────
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if(S.phase === 'intro' && (e.code === 'Space' || e.code === 'Enter')){ skipIntro(); return; }
  if(e.code === 'Space' && S.phase === 'fight' && !S.over){
    e.preventDefault();
    paused = !paused;
    document.getElementById('pbanner').style.display = paused ? 'flex' : 'none';
    if(!paused && queued !== null){ const q = queued; queued = null; window.tryAbility(q); }
  }
  const map = {Digit1:0,Digit2:1,Digit3:2,Digit4:3,Digit5:4,KeyQ:5};
  if(map[e.code] !== undefined) window.tryAbility(map[e.code]);
});
addEventListener('keyup', e => keys[e.code] = false);

// touch strafe: horizontal drag on canvas
let dragX = null, dragVel = 0;
canvas.addEventListener('pointerdown', e => {
  if(S.phase === 'intro'){ skipIntro(); return; }
  dragX = e.clientX;
});
canvas.addEventListener('pointermove', e => {
  if(dragX === null) return;
  const dx = e.clientX - dragX; dragX = e.clientX;
  dragVel = clamp(dx * .0032, -.09, .09);
});
addEventListener('pointerup', () => { dragX = null; });

function updatePlayer(dt, t){
  if(S.phase === 'fight' && !S.over && !paused){
    let av = 0;
    if(keys.KeyA || keys.ArrowLeft) av += 1.0;
    if(keys.KeyD || keys.ArrowRight) av -= 1.0;
    playerAngle += av * dt * .55;
    if(dragVel){ playerAngle += dragVel; dragVel *= .82; if(Math.abs(dragVel)<.0004) dragVel=0; }
    syncPlayerPos();
  }
  if(S.phase === 'fight' || S.phase === 'end'){
    if(killCam){
      killCam.t += dt;
      const k = clamp(killCam.t/killCam.dur, 0, 1);
      const a = killCam.a0 + k * Math.PI * .9;
      const r = lerp(killCam.r, 2.6, k);
      camera.position.set(
        bendakPos.x + Math.sin(a)*r,
        lerp(1.7, .8, k),
        bendakPos.z + Math.cos(a)*r);
      camera.lookAt(bendakPos.x, .7, bendakPos.z);
      return;
    }
    shakeAmt = Math.max(0, shakeAmt - dt*4.5);
    caAmt = Math.max(0, caAmt - dt*.8);
    const sx = rnd(-shakeAmt, shakeAmt), sy = rnd(-shakeAmt, shakeAmt);
    camera.position.set(
      playerPos.x + sx,
      1.65 + sy + Math.sin(t*1.1)*.008,
      playerPos.z);
    camera.lookAt(bendakChest());
    vigPass.uniforms.ca.value = caAmt;
  }
  // viewmodel recoil
  if(weaponGroup){
    if(weaponRecoil > 0){
      weaponRecoil = Math.max(0, weaponRecoil - dt*8);
      const r = weaponRecoil;
      weaponGroup.position.set(.24, -.22 + r*.02, -.46 + r*.06);
      weaponGroup.rotation.set(r*.16, .07, .015);
    }
    weaponGroup.visible = (S.phase === 'fight' || S.phase === 'countdown') && !killCam;
    // subtle sway
    if(weaponGroup.visible && weaponRecoil === 0){
      weaponGroup.position.set(
        .24 + Math.sin(t*1.3)*.004,
        -.22 + Math.sin(t*1.7)*.005, -.46);
    }
  }
}

// ── HUD ─────────────────────────────────────────────────────────
function showHitMarker(){
  const hm=document.getElementById('hitmkr');
  hm.style.transition='none'; hm.style.opacity='1';
  setTimeout(()=>{ hm.style.transition='opacity .4s'; hm.style.opacity='0'; },120);
}
function addLog(html){
  const lg=document.getElementById('log');
  const d2=document.createElement('div'); d2.innerHTML=html; lg.prepend(d2);
  while(lg.children.length>7) lg.lastChild.remove();
}
function syncHud(){
  const pp=S.php/S.phmax, psh=S.psh/S.pshmax;
  const bp=S.bhp/S.bhmax, bsh=S.bsh/S.bshmax;
  document.getElementById('phpf').style.width=(pp*100)+'%';
  document.getElementById('phpf').className='hpfill '+(pp>.35?'g':'r');
  document.getElementById('pshf').style.width=(psh*100)+'%';
  document.getElementById('phpn').textContent=`${S.php} / ${S.phmax}`+(S.psh>0?` ⛨${S.psh}`:'');
  document.getElementById('bhpf').style.width=(bp*100)+'%';
  document.getElementById('bshf').style.width=(bsh*100)+'%';
  document.getElementById('bhpn').textContent=`${S.bhp} / ${S.bhmax}`+(S.bsh>0?` ⛨${S.bsh}`:'');
  document.getElementById('sct').textContent='×'+S.pshields;
  document.getElementById('mct').textContent='×'+S.pmeds;
  for(let i=0;i<6;i++){
    const frac=ABCD[i]>0?CDS[i]/ABCD[i]:0;
    document.getElementById('cd'+i).style.height=(frac*100)+'%';
    document.getElementById('ab'+i).classList.toggle('off',
      CDS[i]>0||S.pgcd>0||!ABILITIES[i].can()||S.over||S.phase!=='fight');
  }
  document.getElementById('flash').style.opacity=flashAmt.toFixed(3);
}

// ── Main Loop ───────────────────────────────────────────────────
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  window.__frames = (window.__frames|0) + 1;
  const rawDt = Math.min(clock.getDelta(), .05);
  const dt = paused ? 0 : rawDt;
  const t = clock.elapsedTime;

  if(S.phase === 'intro') updateIntro(rawDt, t);
  else if(S.phase === 'countdown') updateCountdown(rawDt);

  if(!paused){
    if(S.phase === 'fight' && !S.over){
      aiTick(dt);
      S.pgcd = Math.max(0, S.pgcd - dt);
      S.pdodge = Math.max(0, S.pdodge - dt);
      S.bdodge = Math.max(0, S.bdodge - dt);
      for(let i=0;i<6;i++) CDS[i] = Math.max(0, CDS[i] - dt);
    }
    updateBendak(dt, t);
    updateBolts(S.slowMo ? dt*.25 : dt);
    updateSparks(S.slowMo ? dt*.3 : dt);
    updateFloaters(dt);
    updateCrowd(S.phase === 'title' ? rawDt : dt);
    flashAmt = Math.max(0, flashAmt - rawDt*1.8);
  }
  updatePlayer(rawDt, t);

  // holoboard scroll
  holoScroll += rawDt * 130;
  drawHolo(holoText);

  syncHud();
  if(useComposer) composer.render();
  else renderer.render(scene, camera);

  // auto-degrade on sustained low fps during the fight
  if(useComposer && S.phase === 'fight'){
    fpsAcc += rawDt; fpsN++;
    if(fpsAcc > 4){
      if(fpsN / fpsAcc < 24) degradeQuality();
      fpsAcc = 0; fpsN = 0;
    }
  }
}
let fpsAcc = 0, fpsN = 0;

// ── Boot ────────────────────────────────────────────────────────
(async () => {
  buildArena();
  buildLights();
  buildBubble();
  try {
    await loadAssets();
  } catch(e){
    document.getElementById('loadtxt').textContent = 'LOAD FAILED — ' + (e.message || e);
    throw e;
  }
  buildBendak();
  buildCrowdActors();
  buildViewmodel();
  // title-screen camera: wide establishing shot
  camera.position.set(0, 3.2, 12.5);
  camera.lookAt(0, 1.2, 0);
  document.getElementById('loading').classList.add('gone');
  showTitle();
  tick();
})();
